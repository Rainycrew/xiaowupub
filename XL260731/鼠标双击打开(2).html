<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PyExplain Lite - Python代码解释器</title>
  <style>
    :root {
  --font-main: "MiSans", "HarmonyOS Sans SC", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-code: "JetBrains Mono", "Cascadia Code", "Sarasa Mono SC", "Consolas", monospace;

  --bg-top: #f2f5ff;
  --bg-bottom: #eef7ff;
  --panel-bg: rgba(255, 255, 255, 0.86);
  --panel-border: #d9e3f6;
  --surface-muted: #f4f8ff;
  --text-main: #253553;
  --text-soft: #5f6f8d;
  --primary: #2f7df7;
  --primary-dark: #1e63ce;
  --accent: #0f9d8f;
  --success: #229268;
  --warning: #dd8b28;
  --danger: #cc4d5f;
  --shadow-panel: 0 24px 52px rgba(40, 73, 133, 0.13);
  --shadow-soft: 0 10px 24px rgba(54, 88, 148, 0.12);
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  font-family: var(--font-main);
  color: var(--text-main);
  background: linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
  position: relative;
  overflow-x: hidden;
}

.bg-orb {
  position: fixed;
  border-radius: 999px;
  filter: blur(1px);
  opacity: 0.58;
  pointer-events: none;
  z-index: 0;
}

.orb-left {
  width: 340px;
  height: 340px;
  left: -70px;
  top: 18%;
  background: radial-gradient(circle at 30% 30%, #d4ecff 0%, #b7ceff 56%, #aac0f4 100%);
}

.orb-right {
  width: 380px;
  height: 380px;
  right: -90px;
  top: 8%;
  background: radial-gradient(circle at 60% 40%, #f0f7ff 0%, #d7e6ff 55%, #c7dafd 100%);
}

.app-shell {
  position: relative;
  z-index: 1;
  width: min(1140px, calc(100% - 32px));
  margin: 30px auto;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 22px;
}

.panel {
  border: 1px solid var(--panel-border);
  border-radius: 24px;
  background: var(--panel-bg);
  backdrop-filter: blur(5px);
  box-shadow: var(--shadow-panel);
  padding: 22px;
}

.brand-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
}

.brand h1 {
  margin: 0;
  font-size: 34px;
  line-height: 1;
  letter-spacing: -0.4px;
}

.brand-icon {
  width: 36px;
  height: 36px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.brand-icon svg {
  width: 100%;
  height: 100%;
}

.icon-btn {
  min-height: 40px;
  border: 1px solid #d3ddef;
  background: #f5f9ff;
  color: #48608f;
  border-radius: 10px;
  padding: 0 12px;
  font-weight: 700;
  cursor: pointer;
}

.intro h2 {
  margin: 12px 0 6px;
  font-size: 32px;
  letter-spacing: -0.3px;
}

.intro p {
  margin: 0 0 14px;
  color: var(--text-soft);
  font-size: 16px;
}

.syntax-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 0 0 10px;
}

.syntax-chip {
  border-radius: 999px;
  border: 1px solid #d8e4f7;
  background: #f3f8ff;
  color: #49638f;
  font-size: 12px;
  font-weight: 700;
  padding: 4px 10px;
}

.section-title {
  display: inline-block;
  font-weight: 700;
  margin: 8px 0;
}

.code-input,
.source-code,
.line-code {
  font-family: var(--font-code);
}

.code-input {
  width: 100%;
  min-height: 210px;
  border: 1px solid #dae5f8;
  border-radius: 14px;
  background: #f9fbff;
  color: #274063;
  padding: 14px;
  font-size: 15px;
  line-height: 1.55;
  resize: vertical;
}

.code-input:focus {
  outline: 2px solid rgba(47, 125, 247, 0.22);
  border-color: #acc9ff;
}

.sample-grid {
  margin-top: 12px;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 9px;
}

.sample-btn {
  min-height: 44px;
  border-radius: 12px;
  border: 1px solid #dbe4f6;
  background: #f2f7ff;
  color: #334e77;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.18s ease, box-shadow 0.18s ease, background-color 0.18s ease;
}

.sample-btn:hover {
  transform: translateY(-1px);
  box-shadow: var(--shadow-soft);
  background: #e8f1ff;
}

.action-row {
  margin-top: 12px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.btn {
  min-height: 46px;
  border-radius: 12px;
  border: 1px solid transparent;
  font-size: 16px;
  font-weight: 800;
  cursor: pointer;
  letter-spacing: 0.2px;
}

.btn-primary {
  color: #fff;
  background: linear-gradient(135deg, var(--primary), #4b9cff);
  box-shadow: 0 10px 24px rgba(47, 125, 247, 0.3);
}

.btn-primary:hover {
  background: linear-gradient(135deg, var(--primary-dark), var(--primary));
}

.btn-primary-light {
  color: #fff;
  background: linear-gradient(135deg, #4f89e8, #5ba4ff);
}

.btn-ghost {
  color: #425a82;
  border-color: #d5def0;
  background: #f8faff;
}

.quick-history-wrap {
  margin-top: 14px;
}

.quick-history-wrap h3 {
  margin: 0 0 8px;
  font-size: 18px;
}

.usage-hint {
  margin: 0 0 10px;
  color: #6f809f;
  font-size: 14px;
}

.tab-row {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
}

.tab-btn {
  min-height: 42px;
  padding: 0 14px;
  border-radius: 11px;
  border: 1px solid #d6e1f5;
  background: #f3f7ff;
  color: #48628f;
  font-weight: 800;
  cursor: pointer;
}

.tab-btn.active {
  color: #fff;
  border-color: #3d8af8;
  background: linear-gradient(130deg, #2f7df7, #5ba3ff);
  box-shadow: 0 8px 18px rgba(58, 130, 245, 0.25);
}

.tab-view {
  display: none;
}

.tab-view.active {
  display: block;
}

.source-box {
  margin-top: 8px;
  border: 1px solid #dde6f7;
  border-radius: 14px;
  padding: 10px;
  background: #f8fbff;
}

.back-btn {
  min-height: 38px;
  border-radius: 10px;
  border: 1px solid #d5e1f4;
  background: #f4f8ff;
  color: #45608a;
  font-weight: 700;
  padding: 0 12px;
  cursor: pointer;
}

.source-title {
  font-size: 14px;
  color: #5b6e91;
  margin-bottom: 6px;
}

.source-code {
  margin: 0;
  padding: 12px;
  border-radius: 10px;
  background: #edf3ff;
  color: #2f4f82;
  font-size: 15px;
  line-height: 1.55;
  overflow-x: auto;
}

.empty-state {
  margin-top: 12px;
  border: 1px dashed #c8d7f3;
  border-radius: 12px;
  background: #f7fbff;
  color: #6d7f9d;
  padding: 12px;
  font-size: 15px;
}

.explanation-list {
  list-style: none;
  margin: 12px 0 0;
  padding: 0;
  display: grid;
  gap: 10px;
}

.line-card {
  border: 1px solid #dae4f6;
  border-radius: 14px;
  padding: 12px;
  background: #fff;
}

.line-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}

.line-number {
  color: #60718f;
  font-size: 14px;
  font-weight: 700;
}

.type-pill {
  border-radius: 999px;
  padding: 4px 10px;
  font-size: 13px;
  font-weight: 800;
}

.type-output { background: #e6f3ff; color: #2f7af0; }
.type-input { background: #ecf8f5; color: #2b9a75; }
.type-flow { background: #f0edff; color: #6a58d6; }
.type-function { background: #fff2de; color: #c97b16; }
.type-comment { background: #eff2f8; color: #677892; }
.type-variable { background: #edf9f0; color: #2f9154; }
.type-list { background: #fef5e8; color: #ca7f1f; }
.type-module { background: #e8f1ff; color: #2f68bf; }
.type-class { background: #eee9ff; color: #644bd1; }
.type-exception { background: #ffecee; color: #c2535f; }
.type-context { background: #e7f7f6; color: #1f8792; }
.type-call { background: #e8f6ff; color: #2d7da5; }
.type-container { background: #fff5e8; color: #c17a1f; }
.type-operator { background: #eaf8ef; color: #2f8f57; }
.type-unknown { background: #fff3e7; color: #c67a26; }
.type-blank { background: #f2f4f9; color: #8a96ad; }

.line-code {
  margin: 9px 0 6px;
  padding: 10px;
  border-radius: 10px;
  background: #f4f8ff;
  color: #304c75;
  font-size: 14px;
  line-height: 1.5;
  overflow-x: auto;
}

.line-explanation {
  margin: 0;
  color: #2d3f60;
  font-size: 15px;
  line-height: 1.58;
}

.summary-card {
  margin-top: 12px;
  border: 1px solid #cde3dc;
  border-radius: 14px;
  background: #edf9f4;
  padding: 12px;
}

.summary-card h3 {
  margin: 0 0 8px;
  color: #2b7f64;
}

.summary-card p {
  margin: 0;
  color: #2c4a5f;
  line-height: 1.6;
}

.result-actions {
  margin-top: 12px;
}

.history-tip {
  margin-bottom: 12px;
  border: 1px solid #dde6f7;
  border-radius: 12px;
  background: #f6f9ff;
  color: #647596;
  padding: 10px 12px;
}

.history-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin: 0 0 10px;
}

.history-meta {
  color: #607290;
  font-size: 14px;
  font-weight: 700;
}

.history-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 9px;
}

.history-item {
  border: 1px solid #dae4f6;
  border-radius: 12px;
  background: #fff;
  padding: 10px;
}

.history-item-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

.history-title {
  margin: 0;
  font-size: 16px;
  font-weight: 800;
  color: #314567;
}

.history-time {
  color: #7a8ca8;
  font-size: 13px;
}

.history-code {
  margin: 8px 0;
  border-radius: 8px;
  background: #f5f8ff;
  color: #40608d;
  font-family: var(--font-code);
  font-size: 13px;
  padding: 8px;
  overflow-x: auto;
  white-space: pre-wrap;
  word-break: break-word;
}

.history-actions {
  display: flex;
  gap: 8px;
}

.history-btn {
  min-height: 36px;
  padding: 0 10px;
  border-radius: 9px;
  border: 1px solid #d7e2f4;
  background: #f6faff;
  color: #3f5d89;
  font-weight: 700;
  cursor: pointer;
}

.history-btn.delete {
  color: var(--danger);
  border-color: #f2d4da;
  background: #fff4f6;
}

.history-btn.danger-lite {
  color: #bb4d5a;
  border-color: #f3d5db;
  background: #fff6f8;
}

.empty-history {
  border: 1px dashed #c8d7f3;
  border-radius: 12px;
  background: #f8fbff;
  color: #6f81a1;
  padding: 12px;
  font-size: 14px;
}

.compact .history-item {
  padding: 8px 10px;
}

.compact .history-code {
  display: none;
}

@media (max-width: 1060px) {
  .app-shell {
    grid-template-columns: 1fr;
    width: min(760px, calc(100% - 24px));
    margin: 16px auto 22px;
  }
}

@media (max-width: 700px) {
  .panel {
    padding: 14px;
    border-radius: 18px;
  }

  .brand h1 {
    font-size: 28px;
  }

  .intro h2 {
    font-size: 26px;
  }

  .sample-grid,
  .action-row {
    grid-template-columns: 1fr;
  }

  .history-toolbar {
    flex-direction: column;
    align-items: stretch;
  }

  .btn,
  .sample-btn {
    min-height: 46px;
  }

  .code-input {
    min-height: 190px;
    font-size: 14px;
  }

  .source-code,
  .line-code {
    font-size: 14px;
  }
}

  </style>
</head>
<body>
  <div class="bg-orb orb-left" aria-hidden="true"></div>
  <div class="bg-orb orb-right" aria-hidden="true"></div>
  <main class="app-shell">
    <section class="panel input-panel" aria-label="输入区">
      <header class="brand-row">
        <div class="brand">
          <span class="brand-icon" aria-hidden="true">
            <svg viewBox="0 0 128 128" role="img" aria-label="PyExplain logo">
              <path fill="#2f7df7" d="M64 14c-28 0-26 12-26 12v14h26v4H27S10 43 10 68s15 24 15 24h9V79s0-15 14-15h24s13 .2 13-13V27S87 14 64 14z"/>
              <circle cx="48" cy="28" r="4" fill="#fff"/>
              <path fill="#f6ca3d" d="M65 114c28 0 26-12 26-12V88H65v-4h37s17 .8 17-24-15-24-15-24h-9v13s0 15-14 15H57s-13-.2-13 13v24s-2 13 21 13z"/>
              <circle cx="80" cy="100" r="4" fill="#fff"/>
            </svg>
          </span>
          <h1>PyExplain</h1>
        </div>
        <button id="quickToHistory" class="icon-btn" type="button" title="查看最近历史">历史</button>
      </header>

      <div class="intro">
        <h2>Python 代码逐行翻译</h2>
        <p>把 Python 基础代码翻译成新手也能看懂的人话。</p>
        <div class="syntax-row" aria-label="支持语法">
          <span class="syntax-chip">print</span>
          <span class="syntax-chip">input</span>
          <span class="syntax-chip">if/elif/else</span>
          <span class="syntax-chip">for/while</span>
          <span class="syntax-chip">def/return</span>
          <span class="syntax-chip">try/except</span>
          <span class="syntax-chip">class/import</span>
        </div>
      </div>

      <label for="codeInput" class="section-title">输入代码</label>
      <textarea
        id="codeInput"
        class="code-input"
        spellcheck="false"
        placeholder="for i in range(3):
    print(i)"
      ></textarea>

      <div class="sample-grid" role="group" aria-label="示例代码">
        <button class="sample-btn" type="button" data-example="output">输出示例</button>
        <button class="sample-btn" type="button" data-example="input">输入示例</button>
        <button class="sample-btn" type="button" data-example="loop">循环示例</button>
        <button class="sample-btn" type="button" data-example="ifelse">判断示例</button>
        <button class="sample-btn" type="button" data-example="advanced">进阶示例</button>
        <button class="sample-btn" type="button" data-example="exception">异常示例</button>
      </div>

      <div class="action-row">
        <button id="clearInputBtn" class="btn btn-ghost" type="button">清空输入</button>
        <button id="explainBtn" class="btn btn-primary" type="button">开始解释</button>
      </div>

      <section class="quick-history-wrap" aria-label="最近历史">
        <h3>最近历史</h3>
        <p id="sampleUsageHint" class="usage-hint">历史会记录你最近 10 次解释。</p>
        <ul id="quickHistoryList" class="history-list compact"></ul>
      </section>
    </section>

    <section class="panel result-panel" aria-label="结果区">
      <div class="tab-row" role="tablist" aria-label="结果视图">
        <button id="tabExplain" class="tab-btn active" type="button" role="tab" aria-selected="true">代码解释</button>
        <button id="tabHistory" class="tab-btn" type="button" role="tab" aria-selected="false">最近历史</button>
      </div>

      <div id="explainView" class="tab-view active" role="tabpanel">
        <button id="backToInput" class="back-btn" type="button">← 返回输入</button>

        <div class="source-box">
          <div class="source-title">原始代码</div>
          <pre id="sourcePreview" class="source-code">等待输入代码...</pre>
        </div>

        <div id="emptyResultHint" class="empty-state">
          点击“开始解释”后，这里会展示逐行解释结果。
        </div>

        <ul id="explanationList" class="explanation-list"></ul>

        <article id="summaryCard" class="summary-card" hidden>
          <h3>整段解释</h3>
          <p id="summaryText"></p>
        </article>

        <div class="action-row result-actions">
          <button id="rerunBtn" class="btn btn-primary-light" type="button">再次解释</button>
          <button id="clearResultBtn" class="btn btn-ghost" type="button">清空结果</button>
        </div>
      </div>

      <div id="historyView" class="tab-view" role="tabpanel" hidden>
        <div class="history-tip">用这个试试写，先对试一下吧。</div>
        <div class="history-toolbar">
          <span id="historyMeta" class="history-meta">已保存 0 条记录</span>
          <button id="clearHistoryBtn" class="history-btn danger-lite" type="button">清空历史</button>
        </div>
        <ul id="historyList" class="history-list"></ul>
      </div>
    </section>
  </main>

  <script>
    (function attachRules(globalScope) {
  "use strict";

  const TYPE_META = {
    blank: { label: "空行", className: "type-blank" },
    comment: { label: "注释", className: "type-comment" },
    module: { label: "导入", className: "type-module" },
    class: { label: "类", className: "type-class" },
    decorator: { label: "装饰器", className: "type-function" },
    assignment: { label: "赋值", className: "type-variable" },
    augmented: { label: "运算赋值", className: "type-operator" },
    unpacking: { label: "解包赋值", className: "type-operator" },
    conditional: { label: "条件表达式", className: "type-operator" },
    lambda: { label: "Lambda", className: "type-function" },
    print: { label: "输出", className: "type-output" },
    input: { label: "输入", className: "type-input" },
    if: { label: "判断", className: "type-flow" },
    elif: { label: "分支", className: "type-flow" },
    else: { label: "否则", className: "type-flow" },
    match: { label: "模式匹配", className: "type-flow" },
    case: { label: "匹配分支", className: "type-flow" },
    for: { label: "循环", className: "type-flow" },
    while: { label: "循环", className: "type-flow" },
    break: { label: "跳出循环", className: "type-flow" },
    continue: { label: "继续循环", className: "type-flow" },
    pass: { label: "占位", className: "type-flow" },
    with: { label: "上下文", className: "type-context" },
    try: { label: "异常处理", className: "type-exception" },
    except: { label: "异常处理", className: "type-exception" },
    finally: { label: "异常处理", className: "type-exception" },
    raise: { label: "抛出异常", className: "type-exception" },
    assert: { label: "断言", className: "type-exception" },
    def: { label: "函数", className: "type-function" },
    return: { label: "返回", className: "type-function" },
    yield: { label: "生成值", className: "type-function" },
    list: { label: "列表", className: "type-list" },
    dict: { label: "字典", className: "type-container" },
    set: { label: "集合", className: "type-container" },
    tuple: { label: "元组", className: "type-container" },
    comprehension: { label: "推导式", className: "type-container" },
    index: { label: "索引/切片", className: "type-container" },
    call: { label: "函数调用", className: "type-call" },
    delete: { label: "删除", className: "type-operator" },
    compare: { label: "比较", className: "type-operator" },
    unknown: { label: "未识别", className: "type-unknown" }
  };

  function readableExpression(value) {
    return String(value || "").trim() || "空值";
  }

  function shortText(value, maxLength) {
    const clean = readableExpression(value);
    const len = Number(maxLength) || 34;
    if (clean.length <= len) {
      return clean;
    }
    return `${clean.slice(0, len)}...`;
  }

  function splitArgs(rawArgs) {
    const text = String(rawArgs || "").trim();
    if (!text) {
      return [];
    }
    return text
      .split(",")
      .map((item) => item.trim())
      .filter(Boolean);
  }

  function describeRangeArgs(rawArgs) {
    const args = splitArgs(rawArgs);

    if (args.length === 1) {
      return `循环执行 ${args[0]} 次`;
    }
    if (args.length === 2) {
      return `从 ${args[0]} 开始到 ${args[1]} 之前进行循环`;
    }
    if (args.length >= 3) {
      return `从 ${args[0]} 到 ${args[1]}（步长 ${args[2]}）进行循环`;
    }
    return "按范围进行循环";
  }

  function operatorMeaning(operatorToken) {
    const map = {
      "+": "加法并更新",
      "-": "减法并更新",

    }

    const ruleResult = findFirstRuleMatch(rawLine);
    if (ruleResult) {
      return {
        lineNumber,
        raw: rawLine,
        type: ruleResult.type,
        explanation: ruleResult.explanation
      };
    }

    return {
      lineNumber,
      raw: rawLine,
      type: "unknown",
      explanation: "这行语句暂未命中当前扩展规则，建议结合上下文理解其作用。"
    };
  }

  function countByType(results) {
    return results.reduce((counter, item) => {
      counter[item.type] = (counter[item.type] || 0) + 1;
      return counter;
    }, {});
  }

  function countGroup(countMap, typeList) {
    return typeList.reduce((sum, key) => sum + (countMap[key] || 0), 0);
  }

  function makeSummary(results) {
    const usefulRows = results.filter((item) => item.type !== "blank");
    if (!usefulRows.length) {
      return "当前内容只有空行，建议先输入一段 Python 代码。";
    }

    const counts = countByType(usefulRows);
    const parts = [];

    const moduleCount = counts.module || 0;
    if (moduleCount) {
      parts.push(`导入了 ${moduleCount} 行模块/依赖`);
    }

    const classCount = counts.class || 0;
    if (classCount) {
      parts.push(`定义了 ${classCount} 个类结构`);
    }

    if (counts.input) {
      parts.push(`包含 ${counts.input} 行输入语句`);
    }

    const assignCount = countGroup(counts, ["assignment", "augmented", "unpacking", "conditional", "delete", "index"]);
    if (assignCount) {
      parts.push(`包含 ${assignCount} 处赋值或数据更新`);
    }

    const containerCount = countGroup(counts, ["list", "dict", "set", "tuple", "comprehension", "index"]);
    if (containerCount) {
      parts.push(`涉及 ${containerCount} 处容器（列表/字典/集合/元组）操作`);
    }

    const outputCount = counts.print || 0;
    if (outputCount) {
      parts.push(`会输出 ${outputCount} 行信息`);
    }

    const callCount = counts.call || 0;
    if (callCount) {
      parts.push(`包含 ${callCount} 处函数/方法调用`);
    }

    const loopCount = (counts.for || 0) + (counts.while || 0);
    if (loopCount > 0) {
      parts.push(`包含 ${loopCount} 处循环逻辑`);
    }

    const controlCount = (counts.break || 0) + (counts.continue || 0) + (counts.pass || 0);
    if (controlCount > 0) {
      parts.push(`有 ${controlCount} 处流程控制语句`);
    }

    const branchCount = (counts.if || 0) + (counts.elif || 0) + (counts.else || 0) + (counts.match || 0) + (counts.case || 0);
    if (branchCount > 0) {
      parts.push(`包含 ${branchCount} 处分支判断`);
    }

    const functionCount = (counts.decorator || 0) + (counts.def || 0) + (counts.lambda || 0) + (counts.return || 0) + (counts.yield || 0);
    if (functionCount > 0) {
      parts.push(`涉及 ${functionCount} 行函数定义或返回逻辑`);
    }

    const exceptionCount = (counts.try || 0) + (counts.except || 0) + (counts.finally || 0) + (counts.raise || 0) + (counts.assert || 0);
    if (exceptionCount > 0) {
      parts.push(`包含 ${exceptionCount} 处异常处理相关语句`);
    }

    if (counts.with) {
      parts.push(`使用了 ${counts.with} 处上下文管理`);
    }

    if (counts.compare) {
      parts.push(`出现了 ${counts.compare} 行显式比较表达式`);
    }

    if (counts.comment) {
      parts.push(`带有 ${counts.comment} 行注释说明`);
    }

    if (counts.unknown) {
      parts.push(`有 ${counts.unknown} 行暂未完全识别，已做保底解释`);
    }

    if (!parts.length) {
      return "这段代码结构较简单，主要由基础语句组成。";
    }

    return `这段代码${parts.join("，")}。`;
  }

  function analyzeCode(rawCode) {
    const safeCode = String(rawCode || "").replace(/\r\n/g, "\n");
    const lines = safeCode.split("\n");
    const lineResults = lines.map((line, index) => classifyLine(line, index + 1));

    return {
      lines: lineResults,
      summary: makeSummary(lineResults)
    };
  }

  globalScope.PyExplainParser = {
    analyzeCode,
    classifyLine,
    makeSummary
  };
})(window);

  </script>
  <script >
    (function attachStorage(globalScope) {
  "use strict";

  const STORAGE_KEY = "pyexplain.history.v1";
  const MAX_HISTORY = 10;

  let memoryStateFallback = {
    history: [],
    sampleStats: {}
  };

  function safeJSONParse(text, fallbackValue) {
    try {
      return JSON.parse(text);
    } catch (error) {
      return fallbackValue;
    }
  }

  function cloneState(rawState) {
    return {
      history: Array.isArray(rawState.history) ? rawState.history.map((item) => ({ ...item })) : [],
      sampleStats: rawState.sampleStats && typeof rawState.sampleStats === "object" ? { ...rawState.sampleStats } : {}
    };
  }

  function normalizeHistoryEntry(item) {
    const source = item && typeof item === "object" ? item : {};
    return {
      id: String(source.id || `${Date.now()}-${Math.random().toString(16).slice(2, 8)}`),
      title: String(source.title || "自定义代码"),
      code: String(source.code || ""),
      createdAt: Number(source.createdAt) || Date.now(),
      sampleType: String(source.sampleType || "custom")
    };
  }

  function deriveStatsFromHistory(historyList) {
    const stats = {};
    historyList.forEach((entry) => {
      const sampleType = String(entry.sampleType || "custom");
      stats[sampleType] = (stats[sampleType] || 0) + 1;
    });
    return stats;
  }

  function normalizeState(parsedData) {
    if (Array.isArray(parsedData)) {
      const history = parsedData.map(normalizeHistoryEntry).slice(0, MAX_HISTORY);
      return {
        history,
        sampleStats: deriveStatsFromHistory(history)
      };
    }

    if (!parsedData || typeof parsedData !== "object") {
      return {
        history: [],
        sampleStats: {}
      };
    }

    const rawHistory = Array.isArray(parsedData.history) ? parsedData.history : [];
    const history = rawHistory.map(normalizeHistoryEntry).slice(0, MAX_HISTORY);

    const rawStats = parsedData.sampleStats && typeof parsedData.sampleStats === "object"
      ? parsedData.sampleStats
      : {};

    const sampleStats = {};
    Object.keys(rawStats).forEach((key) => {
      const normalizedKey = String(key);
      const value = Number(rawStats[key]);
      if (value > 0) {
        sampleStats[normalizedKey] = value;
      }
    });

    if (!Object.keys(sampleStats).length) {
      return {
        history,
        sampleStats: deriveStatsFromHistory(history)
      };
    }

    return {
      history,
      sampleStats
    };
  }

  function getState() {
    let raw = null;
    try {
      raw = globalScope.localStorage.getItem(STORAGE_KEY);
    } catch (error) {
      return cloneState(memoryStateFallback);
    }

    if (!raw) {
      return {
        history: [],
        sampleStats: {}
      };
    }

    const parsed = safeJSONParse(raw, null);
    return normalizeState(parsed);
  }

  function persistState(state) {
    const normalized = normalizeState(state);
    memoryStateFallback = cloneState(normalized);
    try {
      globalScope.localStorage.setItem(STORAGE_KEY, JSON.stringify(normalized));
    } catch (error) {
      return cloneState(normalized);
    }
    return cloneState(normalized);
  }

  function getHistory() {
    return getState().history;
  }

  function getSampleStats() {
    return getState().sampleStats;
  }

  function getMostUsedSampleType() {
    const sampleStats = getSampleStats();
    let topKey = "";
    let topCount = 0;

    Object.keys(sampleStats).forEach((key) => {
      const count = Number(sampleStats[key]) || 0;
      if (count > topCount) {
        topKey = key;
        topCount = count;
      }
    });

    return {
      type: topKey || "custom",
      count: topCount
    };
  }

  function addHistory(entry) {
    const nextEntry = normalizeHistoryEntry(entry);
    const currentState = getState();
    const deduped = currentState.history.filter((item) => item.code !== nextEntry.code);
    deduped.unshift(nextEntry);

    const nextState = {
      history: deduped.slice(0, MAX_HISTORY),
      sampleStats: {
        ...currentState.sampleStats
      }
    };

    const sampleType = nextEntry.sampleType || "custom";
    nextState.sampleStats[sampleType] = (nextState.sampleStats[sampleType] || 0) + 1;

    return persistState(nextState).history;
  }

  function removeHistory(id) {
    const currentState = getState();
    const filtered = currentState.history.filter((item) => item.id !== id);
    return persistState({
      history: filtered,
      sampleStats: currentState.sampleStats
    }).history;
  }

  function clearHistory() {
    return persistState({
      history: [],
      sampleStats: {}
    }).history;
  }

  globalScope.PyExplainStorage = {
    STORAGE_KEY,
    MAX_HISTORY,
    getState,
    getHistory,
    getSampleStats,
    getMostUsedSampleType,
    addHistory,
    removeHistory,
    clearHistory
  };
})(window);

  </script>
  <script >
    (function runApp(globalScope, documentRef) {
  "use strict";

  const state = {
    selectedExample: "custom",
    currentParsed: null,
    history: [],
    sampleStats: {}
  };

  const dom = {
    codeInput: documentRef.getElementById("codeInput"),
    explainBtn: documentRef.getElementById("explainBtn"),
    clearInputBtn: documentRef.getElementById("clearInputBtn"),
    rerunBtn: documentRef.getElementById("rerunBtn"),
    clearResultBtn: documentRef.getElementById("clearResultBtn"),
    sourcePreview: documentRef.getElementById("sourcePreview"),
    explanationList: documentRef.getElementById("explanationList"),
    summaryCard: documentRef.getElementById("summaryCard"),
    summaryText: documentRef.getElementById("summaryText"),
    emptyResultHint: documentRef.getElementById("emptyResultHint"),
    historyList: documentRef.getElementById("historyList"),
    quickHistoryList: documentRef.getElementById("quickHistoryList"),
    sampleUsageHint: documentRef.getElementById("sampleUsageHint"),
    historyMeta: documentRef.getElementById("historyMeta"),
    clearHistoryBtn: documentRef.getElementById("clearHistoryBtn"),
    tabExplain: documentRef.getElementById("tabExplain"),
    tabHistory: documentRef.getElementById("tabHistory"),
    explainView: documentRef.getElementById("explainView"),
    historyView: documentRef.getElementById("historyView"),
    backToInput: documentRef.getElementById("backToInput"),
    quickToHistory: documentRef.getElementById("quickToHistory"),
    sampleButtons: Array.from(documentRef.querySelectorAll(".sample-btn"))
  };

  function escapeHTML(text) {
    return String(text)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function formatTime(timestamp) {
    const dateObj = new Date(timestamp);
    if (Number.isNaN(dateObj.getTime())) {
      return "刚刚";
    }

    const now = Date.now();
    const diff = now - dateObj.getTime();
    if (diff >= 0 && diff < 60 * 1000) {
      return "刚刚";
    }
    if (diff >= 0 && diff < 60 * 60 * 1000) {
      return `${Math.floor(diff / (60 * 1000))}分钟前`;
    }
    if (diff >= 0 && diff < 24 * 60 * 60 * 1000) {
      return `${Math.floor(diff / (60 * 60 * 1000))}小时前`;
    }
    if (diff >= 0 && diff < 7 * 24 * 60 * 60 * 1000) {
      return `${Math.floor(diff / (24 * 60 * 60 * 1000))}天前`;
    }

    return `${dateObj.getFullYear()}-${String(dateObj.getMonth() + 1).padStart(2, "0")}-${String(dateObj.getDate()).padStart(2, "0")}`;
  }

  function getSampleTypeLabel(sampleType) {
    if (sampleType === "custom") {
      return "自定义代码";
    }
    const examples = globalScope.PYEXPLAIN_EXAMPLES || {};
    if (examples[sampleType] && examples[sampleType].title) {
      return examples[sampleType].title;
    }
    return sampleType;
  }

  function deriveTitle(codeText, sampleType) {
    const examples = globalScope.PYEXPLAIN_EXAMPLES || {};
    if (sampleType && examples[sampleType]) {
      return examples[sampleType].title;
    }

    const firstMeaningfulLine = String(codeText || "")
      .split("\n")
      .map((line) => line.trim())
      .find((line) => line.length > 0);

    if (!firstMeaningfulLine) {
      return "空代码";
    }
    if (firstMeaningfulLine.length <= 18) {
      return firstMeaningfulLine;
    }
    return `${firstMeaningfulLine.slice(0, 18)}...`;
  }

  function getTypeMeta(type) {
    const metaMap = globalScope.PYEXPLAIN_TYPE_META || {};
    return metaMap[type] || metaMap.unknown || { label: "未识别", className: "type-unknown" };
  }

  function renderSourcePreview(codeText) {
    const hasCode = String(codeText || "").trim().length > 0;
    dom.sourcePreview.textContent = hasCode ? codeText : "等待输入代码...";
  }

  function renderExplanation(parsedResult) {
    const rows = parsedResult ? parsedResult.lines : [];
    dom.explanationList.innerHTML = "";

    if (!rows || !rows.length) {
      dom.emptyResultHint.hidden = false;
      dom.summaryCard.hidden = true;
      dom.summaryText.textContent = "";
      return;
    }

    dom.emptyResultHint.hidden = true;

    const rowHTML = rows
      .map((line) => {
        const meta = getTypeMeta(line.type);
        return `
          <li class="line-card">
            <div class="line-meta">
              <span class="line-number">第 ${line.lineNumber} 行</span>
              <span class="type-pill ${meta.className}">${meta.label}</span>
            </div>
            <pre class="line-code">${escapeHTML(line.raw || "(空行)")}</pre>
            <p class="line-explanation">${escapeHTML(line.explanation)}</p>
          </li>
        `;
      })
      .join("");

    dom.explanationList.innerHTML = rowHTML;

    if (parsedResult.summary) {
      dom.summaryText.textContent = parsedResult.summary;
      dom.summaryCard.hidden = false;
    } else {
      dom.summaryCard.hidden = true;
    }
  }

  function buildHistoryItemHTML(item, compactMode) {
    const safeCode = escapeHTML(item.code || "");
    const title = escapeHTML(item.title || "未命名");
    const timeText = formatTime(item.createdAt);

    return `
      <li class="history-item" data-history-id="${item.id}">
        <div class="history-item-head">
          <p class="history-title">${title}</p>
          <span class="history-time">${timeText}</span>
        </div>
        <pre class="history-code">${safeCode}</pre>
        <div class="history-actions">
          <button type="button" class="history-btn load" data-action="load">${compactMode ? "恢复" : "恢复到输入区"}</button>
          <button type="button" class="history-btn delete" data-action="delete">删除</button>
        </div>
      </li>
    `;
  }

  function renderHistory() {
    const history = state.history;
    const emptyHTML = '<li class="empty-history">还没有历史记录，先解释一段代码吧。</li>';

    if (dom.historyMeta) {
      dom.historyMeta.textContent = `已保存 ${history.length} 条记录`;
    }

    if (!history.length) {
      dom.historyList.innerHTML = emptyHTML;
      dom.quickHistoryList.innerHTML = emptyHTML;
      return;
    }

    dom.historyList.innerHTML = history.map((item) => buildHistoryItemHTML(item, false)).join("");
    dom.quickHistoryList.innerHTML = history
      .slice(0, 3)
      .map((item) => buildHistoryItemHTML(item, true))
      .join("");
  }

  function renderUsageHint() {
    if (!dom.sampleUsageHint) {
      return;
    }

    const stats = state.sampleStats || {};
    const sorted = Object.keys(stats)
      .map((key) => ({ type: key, count: Number(stats[key]) || 0 }))
      .filter((item) => item.count > 0)
      .sort((a, b) => b.count - a.count);

    if (!sorted.length) {
      dom.sampleUsageHint.textContent = "历史会记录你最近 10 次解释。";
      return;
    }

    const top = sorted[0];
    dom.sampleUsageHint.textContent = `最常使用：${getSampleTypeLabel(top.type)}（${top.count} 次）`;
  }

  function setTab(tabName) {
    const isExplain = tabName === "explain";
    dom.tabExplain.classList.toggle("active", isExplain);
    dom.tabHistory.classList.toggle("active", !isExplain);
    dom.tabExplain.setAttribute("aria-selected", String(isExplain));
    dom.tabHistory.setAttribute("aria-selected", String(!isExplain));
    dom.explainView.hidden = !isExplain;
    dom.historyView.hidden = isExplain;
    dom.explainView.classList.toggle("active", isExplain);
    dom.historyView.classList.toggle("active", !isExplain);
  }

  function executeExplain(saveHistory) {
    const codeText = dom.codeInput.value || "";
    const trimmed = codeText.trim();

    if (!trimmed) {
      renderSourcePreview("");
      renderExplanation(null);
      return;
    }

    const parsed = globalScope.PyExplainParser.analyzeCode(codeText);
    state.currentParsed = parsed;
    renderSourcePreview(codeText);
    renderExplanation(parsed);
    setTab("explain");

    if (saveHistory) {
      const newHistory = globalScope.PyExplainStorage.addHistory({
        title: deriveTitle(codeText, state.selectedExample),
        code: codeText,
        createdAt: Date.now(),
        sampleType: state.selectedExample
      });
      state.history = newHistory;
      state.sampleStats = globalScope.PyExplainStorage.getSampleStats();
      renderHistory();
      renderUsageHint();
    }
  }

  function updateHistoryFromStorage() {
    state.history = globalScope.PyExplainStorage.getHistory();
    state.sampleStats = globalScope.PyExplainStorage.getSampleStats();
    renderHistory();
    renderUsageHint();
  }

  function loadHistoryToInput(historyId) {
    const historyItem = state.history.find((item) => item.id === historyId);
    if (!historyItem) {
      return;
    }

    dom.codeInput.value = historyItem.code || "";
    state.selectedExample = historyItem.sampleType || "custom";
    executeExplain(false);
    setTab("explain");
  }

  function deleteHistoryById(historyId) {
    const next = globalScope.PyExplainStorage.removeHistory(historyId);
    state.history = next;
    state.sampleStats = globalScope.PyExplainStorage.getSampleStats();
    renderHistory();
    renderUsageHint();
  }

  function clearAllHistory() {
    globalScope.PyExplainStorage.clearHistory();
    updateHistoryFromStorage();
  }

  function onHistoryListClick(event) {
    const button = event.target.closest("button[data-action]");
    if (!button) {
      return;
    }

    const item = event.target.closest("[data-history-id]");
    if (!item) {
      return;
    }

    const historyId = item.getAttribute("data-history-id");
    const action = button.getAttribute("data-action");
    if (action === "load") {
      loadHistoryToInput(historyId);
      return;
    }
    if (action === "delete") {
      deleteHistoryById(historyId);
    }
  }

  function bindSampleButtons() {
    const examples = globalScope.PYEXPLAIN_EXAMPLES || {};
    dom.sampleButtons.forEach((button) => {
      button.addEventListener("click", () => {
        const exampleKey = button.getAttribute("data-example") || "";
        const example = examples[exampleKey];
        if (!example) {
          return;
        }
        state.selectedExample = exampleKey;
        dom.codeInput.value = example.code;
        renderSourcePreview(example.code);
        setTab("explain");
      });
    });
  }

  function bindEvents() {
    bindSampleButtons();

    dom.explainBtn.addEventListener("click", () => executeExplain(true));
    dom.rerunBtn.addEventListener("click", () => executeExplain(true));

    dom.clearInputBtn.addEventListener("click", () => {
      state.selectedExample = "custom";
      dom.codeInput.value = "";
      renderSourcePreview("");
    });

    dom.clearResultBtn.addEventListener("click", () => {
      state.currentParsed = null;
      renderSourcePreview("");
      renderExplanation(null);
    });

    dom.codeInput.addEventListener("input", () => {
      state.selectedExample = "custom";
    });

    dom.tabExplain.addEventListener("click", () => setTab("explain"));
    dom.tabHistory.addEventListener("click", () => setTab("history"));
    dom.quickToHistory.addEventListener("click", () => setTab("history"));
    dom.backToInput.addEventListener("click", () => {
      dom.codeInput.focus();
      dom.codeInput.scrollIntoView({ behavior: "smooth", block: "center" });
    });

    dom.historyList.addEventListener("click", onHistoryListClick);
    dom.quickHistoryList.addEventListener("click", onHistoryListClick);
    if (dom.clearHistoryBtn) {
      dom.clearHistoryBtn.addEventListener("click", () => {
        const shouldClear = globalScope.confirm("确认清空全部历史记录吗？");
        if (!shouldClear) {
          return;
        }
        clearAllHistory();
      });
    }
  }

  function init() {
    bindEvents();
    updateHistoryFromStorage();
    setTab("explain");

    const examples = globalScope.PYEXPLAIN_EXAMPLES || {};
    if (examples.loop && !dom.codeInput.value.trim()) {
      state.selectedExample = "loop";
      dom.codeInput.value = examples.loop.code;
      renderSourcePreview(examples.loop.code);
    } else {
      renderSourcePreview(dom.codeInput.value);
    }

    renderExplanation(null);
  }

  documentRef.addEventListener("DOMContentLoaded", init);
})(window, document);

  </script>
