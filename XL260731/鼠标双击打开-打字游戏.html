<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PyType Lite - Python 打字闯关</title>
  <style>
    :root {
  --bg: #e8ebf4;
  --card: #f8f9fe;
  --card-edge: #d8deee;
  --ink: #22355a;
  --ink-soft: #6b7da7;
  --brand: #2f7ff6;
  --brand-dark: #1f5cc4;
  --ok: #36b38a;
  --warn: #f3a63f;
  --bad: #ef5d67;
  --shadow-soft: 0 18px 40px rgba(33, 49, 84, 0.15);
  --shadow-card: 0 10px 22px rgba(44, 73, 128, 0.08);
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
}

body {
  font-family: "Poppins", "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
  background:
    radial-gradient(1200px 460px at 20% -10%, #f4f8ff 0%, rgba(244, 248, 255, 0) 60%),
    radial-gradient(900px 420px at 95% 0%, #e4edff 0%, rgba(228, 237, 255, 0) 70%),
    var(--bg);
  color: var(--ink);
}

.app-shell {
  min-height: 100vh;
  padding: 20px;
  display: grid;
  place-items: center;
}

.phone-frame {
  width: min(980px, 100%);
  min-height: min(920px, calc(100vh - 40px));
  border-radius: 32px;
  padding: 22px;
  background:
    linear-gradient(135deg, #f5f7ff 0%, #ebf0ff 50%, #f9fbff 100%);
  box-shadow: var(--shadow-soft);
  border: 1px solid #d6def4;
  position: relative;
  overflow: hidden;
}

.view {
  display: none;
  animation: fade-in 0.28s ease;
}

.view.active {
  display: block;
}

.card {
  background: var(--card);
  border: 1px solid var(--card-edge);
  border-radius: 20px;
  box-shadow: var(--shadow-card);
}

.home-header {
  padding: 16px 18px;
  display: flex;
  justify-content: space-between;
  gap: 12px;
  align-items: center;
}

.brand-row {
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo-mark {
  width: 42px;
  height: 42px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  color: #fff;
  font-weight: 700;
  letter-spacing: 0.5px;
  background: linear-gradient(160deg, #38a7ff, #265fde);
  box-shadow: 0 8px 14px rgba(47, 127, 246, 0.35);
}

h1 {
  margin: 0;
  font-size: 1.95rem;
  line-height: 1.1;
  letter-spacing: 0.3px;
}

h2,
h3,
p {
  margin: 0;
}

.sub-text {
  margin-top: 3px;
  color: var(--ink-soft);
  font-size: 0.94rem;
}

.hero {
  margin-top: 14px;
  padding: 26px 22px;
  background:
    radial-gradient(220px 80px at 0 100%, #edf3ff 0, rgba(237, 243, 255, 0) 65%),
    radial-gradient(280px 80px at 100% 0, #edf3ff 0, rgba(237, 243, 255, 0) 72%),
    var(--card);
}

.hero h2 {
  font-size: clamp(1.55rem, 2.2vw, 2.1rem);
}

.hero p {
  margin-top: 8px;
  color: #4e6391;
}

.primary-btn,
.ghost-btn {
  border: 0;
  border-radius: 12px;
  min-height: 46px;
  padding: 0 18px;
  font-size: 1rem;
  cursor: pointer;
  transition: transform 0.16s ease, box-shadow 0.16s ease, opacity 0.16s ease;
}

.primary-btn:hover,
.ghost-btn:hover,
.mode-card:hover,
.icon-btn:hover {
  transform: translateY(-1px);
}

.primary-btn:active,
.ghost-btn:active,
.mode-card:active,
.icon-btn:active {
  transform: translateY(0);
}

.primary-btn {
  margin-top: 16px;
  color: #fff;
  font-weight: 600;
  background: linear-gradient(120deg, var(--brand), #4d9bff);
  box-shadow: 0 12px 22px rgba(47, 127, 246, 0.3);
}

.ghost-btn {
  color: #335387;
  background: #f3f6ff;
  border: 1px solid #ced8f1;
}

.mode-list {
  margin-top: 14px;
  display: grid;
  gap: 12px;
}

.mode-card {
  border: 1px solid var(--card-edge);
  background: var(--card);
  border-radius: 16px;
  padding: 14px 16px;
  display: grid;
  grid-template-columns: 48px 1fr;
  grid-template-rows: 1fr 1fr;
  text-align: left;
  gap: 1px 10px;
  cursor: pointer;
  box-shadow: var(--shadow-card);
  transition: border-color 0.18s ease, transform 0.18s ease, box-shadow 0.18s ease;
}

.mode-card.selected {
  border-color: #7faeff;
  background: linear-gradient(145deg, #f8fbff 0%, #eef5ff 100%);
  box-shadow: 0 12px 26px rgba(47, 127, 246, 0.2);
}

.mode-icon {
  grid-row: 1 / 3;
  align-self: center;
  justify-self: center;
  color: #4d75bd;
  font-size: 1.45rem;
}

.mode-title {
  font-size: 1.12rem;
  font-weight: 600;
}

.mode-desc {
  color: #6e7fa3;
}

.summary {
  margin-top: 14px;
  padding: 14px 16px;
}

.summary-row,
.result-row {
  min-height: 42px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid #e7ecfa;
}

.summary-row:last-child,
.result-row:last-child {
  border-bottom: 0;
}

.summary-row strong,
.result-row strong {
  color: #2e4f87;
  font-size: 1.12rem;
}

.game-view {
  color: #e7efff;
  border-radius: 24px;
  padding: 12px;
  background:
    radial-gradient(340px 180px at 10% 2%, rgba(80, 145, 255, 0.35), rgba(80, 145, 255, 0) 60%),
    linear-gradient(180deg, #1b3f79 0%, #123568 50%, #173d73 100%);
  border: 1px solid #3f66ad;
  box-shadow: 0 16px 34px rgba(17, 38, 77, 0.36);
}

.game-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}

.mode-name {
  font-size: 1.2rem;
  font-weight: 600;
}

.icon-btn {
  width: 40px;
  height: 40px;
  border-radius: 11px;
  border: 1px solid #527ad2;
  background: #1f3f80;
  color: #dbe6ff;
  font-size: 1rem;
  cursor: pointer;
}

.status-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
}

.status-item {
  border: 1px solid #365eab;
  border-radius: 13px;
  background: linear-gradient(170deg, #233f79, #1e3667);
  padding: 8px 10px;
}

.status-item span {
  color: #a8bde9;
  font-size: 0.83rem;
}

.status-item strong {
  display: block;
  margin-top: 4px;
  font-size: 1.08rem;
  letter-spacing: 0.3px;
}

.arena {
  position: relative;
  margin-top: 12px;
  height: clamp(380px, 56vh, 540px);
  border-radius: 20px;
  border: 1px solid #3c62ac;
  overflow: hidden;
  background:
    radial-gradient(circle at 20% 18%, rgba(86, 137, 255, 0.35), rgba(86, 137, 255, 0) 40%),
    linear-gradient(180deg, #173564 0%, #102848 55%, #112f58 100%);
}

.arena::after {
  content: "";
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    to bottom,
    rgba(126, 169, 255, 0.12) 0,
    rgba(126, 169, 255, 0.12) 1px,
    rgba(0, 0, 0, 0) 1px,
    rgba(0, 0, 0, 0) 9px
  );
  opacity: 0.2;
  pointer-events: none;
}

.rain-layer {
  position: absolute;
  inset: 0;
  overflow: hidden;
}

.drop-word {
  position: absolute;
  min-width: 46px;
  max-width: 90%;
  padding: 5px 10px;
  border-radius: 10px;
  color: #bffcff;
  text-shadow: 0 0 6px rgba(151, 245, 255, 0.4);
  font-size: clamp(1rem, 1.6vw, 1.4rem);
  font-weight: 600;
  white-space: nowrap;
  transform: translateY(-120%);
}

.drop-word.hit {
  background: rgba(101, 218, 176, 0.24);
  color: #d6ffe8;
}

.single-target {
  position: absolute;
  left: 50%;
  top: 45%;
  transform: translate(-50%, -50%);
  width: min(580px, 90%);
  border-radius: 20px;
  border: 1px solid #6d93d9;
  background: rgba(22, 54, 104, 0.7);
  box-shadow: 0 14px 26px rgba(16, 38, 73, 0.45);
  padding: 20px;
  text-align: center;
}

.single-target.hidden {
  display: none;
}

.single-target .label {
  color: #aac4f5;
  font-size: 0.95rem;
}

.single-target-text {
  margin-top: 8px;
  font-size: clamp(1.65rem, 4vw, 2.4rem);
  letter-spacing: 0.7px;
  font-weight: 700;
}

.feedback-bar {
  margin-top: 10px;
  border-radius: 11px;
  border: 1px solid #4f76c7;
  background: #1d3f7f;
  color: #c7daff;
  min-height: 42px;
  display: flex;
  align-items: center;
  padding: 0 14px;
}

.feedback-bar.good {
  color: #d6ffe8;
  border-color: #52ac90;
  background: #1f5a56;
}

.feedback-bar.bad {
  color: #ffe6e8;
  border-color: #c36b72;
  background: #6c2e44;
}

.feedback-bar.warn {
  color: #fff4dd;
  border-color: #cf9550;
  background: #735029;
}

.input-row {
  margin-top: 10px;
  display: grid;
  grid-template-columns: 1fr 118px;
  gap: 10px;
}

#wordInput {
  min-height: 48px;
  border-radius: 12px;
  border: 1px solid #587cc2;
  background: #f4f7ff;
  color: #1c2f56;
  font-size: 1.08rem;
  padding: 0 12px;
}

#wordInput:focus {
  outline: 2px solid #9cbef9;
  outline-offset: 2px;
}

.result-head,
.result-card,
.stats-grid,
.mode-best {
  margin-top: 14px;
}

.result-head,
.result-card,
.mode-best {
  padding: 16px 18px;
}

.result-head p {
  margin-top: 6px;
  color: #6479a1;
}

.result-actions {
  display: grid;
  gap: 10px;
  margin-top: 14px;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}

.stat-box {
  padding: 16px 14px;
}

.stat-box span {
  color: #6f80a5;
}

.stat-box strong {
  margin-top: 8px;
  display: block;
  font-size: 1.6rem;
  color: #2b4f86;
}

.wrong-list {
  margin: 10px 0 0;
  padding-left: 20px;
  color: #5671a5;
}

.wrong-list li {
  margin: 7px 0;
}

.full-width {
  width: 100%;
  margin-top: 12px;
}

@keyframes fade-in {
  from {
    opacity: 0;
    transform: translateY(6px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@media (max-width: 900px) {
  .app-shell {
    padding: 0;
  }

  .phone-frame {
    border-radius: 0;
    min-height: 100vh;
    width: 100%;
    padding: 14px;
  }

  .status-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .arena {
    height: 48vh;
  }
}

@media (max-width: 560px) {
  h1 {
    font-size: 1.72rem;
  }

  .mode-title {
    font-size: 1.02rem;
  }

  .mode-desc,
  .sub-text,
  .hero p {
    font-size: 0.92rem;
  }

  .stats-grid {
    grid-template-columns: 1fr;
  }

  .input-row {
    grid-template-columns: 1fr;
  }

  .primary-btn,
  .ghost-btn {
    width: 100%;
  }
}

  </style>
</head>
<body>
  <div class="app-shell">
    <main class="phone-frame">
      <section id="homeView" class="view active" aria-label="首页">
        <header class="home-header card">
          <div class="brand-row">
            <div class="logo-mark">Py</div>
            <div>
              <h1>PyType</h1>
              <p class="sub-text">边练打字，边熟悉 Python 词汇与代码符号</p>
            </div>
          </div>
          <button id="openStatsBtn" class="ghost-btn">统计</button>
        </header>

        <section class="hero card">
          <h2>PyType 打字闯关</h2>
          <p>打开就能玩，专为 Python 初学者设计的输入训练游戏。</p>
          <button id="startGameBtn" class="primary-btn">开始闯关</button>
        </section>

        <section class="mode-list">
          <button class="mode-card selected" data-mode="rain">
            <span class="mode-icon">☔</span>
            <span class="mode-title">代码雨模式</span>
            <span class="mode-desc">打掉下落词条，守住生命值</span>
          </button>
          <button class="mode-card" data-mode="sprint">
            <span class="mode-icon">⚡</span>
            <span class="mode-title">单词冲刺</span>
            <span class="mode-desc">逐题计时，拼速度与准确率</span>
          </button>
          <button class="mode-card" data-mode="symbol">
            <span class="mode-icon">{ }</span>
            <span class="mode-title">符号训练</span>
            <span class="mode-desc">专攻括号、比较符和短片段</span>
          </button>
        </section>

        <section class="summary card">
          <div class="summary-row">
            <span>历史最高分</span>
            <strong id="bestScoreValue">0</strong>
          </div>
          <div class="summary-row">
            <span>累计练习局数</span>
            <strong id="totalGamesValue">0</strong>
          </div>
          <div class="summary-row">
            <span>已解锁关卡</span>
            <strong id="unlockedValue">基础</strong>
          </div>
        </section>
      </section>

      <section id="gameView" class="view game-view" aria-label="游戏中">
        <header class="game-top">
          <button id="backHomeBtn" class="icon-btn" title="返回首页">←</button>
          <div class="mode-name" id="modeLabel">代码雨模式</div>
          <button id="pauseBtn" class="icon-btn" title="暂停">⏸</button>
        </header>

        <div class="status-grid">
          <div class="status-item">
            <span>分数</span>
            <strong id="scoreValue">0</strong>
          </div>
          <div class="status-item">
            <span>生命</span>
            <strong id="lifeValue">5</strong>
          </div>
          <div class="status-item">
            <span>连击</span>
            <strong id="comboValue">0</strong>
          </div>
          <div class="status-item">
            <span>关卡/进度</span>
            <strong id="progressValue">1-1</strong>
          </div>
        </div>

        <section id="arena" class="arena" aria-live="polite">
          <div id="rainLayer" class="rain-layer"></div>
          <div id="singleTargetBox" class="single-target hidden">
            <div class="label">当前目标</div>
            <div id="singleTargetText" class="single-target-text">print</div>
          </div>
        </section>

        <div id="feedbackBar" class="feedback-bar">准备开始</div>

        <form id="inputForm" class="input-row" autocomplete="off">
          <input
            id="wordInput"
            type="text"
            spellcheck="false"
            autocapitalize="off"
            autocomplete="off"
            placeholder="输入目标并回车"
          >
          <button class="primary-btn" type="submit">确认</button>
        </form>
      </section>

      <section id="resultView" class="view" aria-label="结算页">
        <header class="result-head card">
          <h2>本局结算</h2>
          <p id="resultModeLabel">代码雨模式</p>
        </header>
        <section class="result-card card">
          <div class="result-row"><span>得分</span><strong id="resultScore">0</strong></div>
          <div class="result-row"><span>正确击中</span><strong id="resultCorrect">0</strong></div>
          <div class="result-row"><span>错误/漏掉</span><strong id="resultWrong">0</strong></div>
          <div class="result-row"><span>正确率</span><strong id="resultAccuracy">0%</strong></div>
          <div class="result-row"><span>最长连击</span><strong id="resultCombo">0</strong></div>
          <div class="result-row"><span>历史最高</span><strong id="resultBest">0</strong></div>
        </section>
        <div class="result-actions">
          <button id="retryBtn" class="primary-btn">再来一局</button>
          <button id="goHomeBtn" class="ghost-btn">返回首页</button>
        </div>
      </section>

      <section id="statsView" class="view" aria-label="统计页">
        <header class="card">
          <h2>训练统计</h2>
          <p>所有数据仅保存在你的浏览器本地。</p>
        </header>
        <section class="stats-grid">
          <article class="card stat-box">
            <span>总局数</span>
            <strong id="statsGames">0</strong>
          </article>
          <article class="card stat-box">
            <span>总正确</span>
            <strong id="statsCorrect">0</strong>
          </article>
          <article class="card stat-box">
            <span>总错误</span>
            <strong id="statsWrong">0</strong>
          </article>
          <article class="card stat-box">
            <span>全局最高连击</span>
            <strong id="statsCombo">0</strong>
          </article>
        </section>
        <section class="card mode-best">
          <h3>模式最佳成绩</h3>
          <div class="summary-row">
            <span>代码雨</span>
            <strong id="bestRain">0</strong>
          </div>
          <div class="summary-row">
            <span>单词冲刺</span>
            <strong id="bestSprint">0</strong>
          </div>
          <div class="summary-row">
            <span>符号训练</span>
            <strong id="bestSymbol">0</strong>
          </div>
        </section>
        <section class="card">
          <h3>最常错内容（Top 5）</h3>
          <ol id="wrongList" class="wrong-list"></ol>
        </section>
        <button id="closeStatsBtn" class="ghost-btn full-width">返回首页</button>
      </section>
    </main>
  </div>

  <script >
    window.PYTYPE_DATA = {
  pools: {
    basic: [
      "print",
      "input",
      "list",
      "dict",
      "tuple",
      "string",
      "float",
      "integer",
      "value",
      "key"
    ],
    keyword: [
      "if",
      "else",
      "elif",
      "for",
      "while",
      "break",
      "continue",
      "return",
      "def",
      "class"
    ],
    symbol: [
      "()",
      "[]",
      "{}",
      "\"\"",
      "''",
      ":",
      "=",
      "==",
      "!=",
      "print()",
      "if:",
      "for i in",
      "name ="
    ]
  },
  unlockRules: [
    { key: "basic", label: "基础", scoreNeed: 0 },
    { key: "keyword", label: "关键字", scoreNeed: 220 },
    { key: "symbol", label: "符号", scoreNeed: 520 }
  ],
  modes: {
    rain: {
      key: "rain",
      title: "代码雨模式",
      startLives: 5,
      baseScore: 10
    },
    sprint: {
      key: "sprint",
      title: "单词冲刺",
      rounds: 15,
      baseScore: 10
    },
    symbol: {
      key: "symbol",
      title: "符号训练",
      rounds: 18,
      baseScore: 15
    }
  }
};

  </script>
  <script >
    (() => {
  const STORAGE_KEY = "pytype_lite_save_v1";

    modeLabel: document.getElementById("modeLabel"),
    scoreValue: document.getElementById("scoreValue"),
    lifeValue: document.getElementById("lifeValue"),
    comboValue: document.getElementById("comboValue"),
    progressValue: document.getElementById("progressValue"),
    feedbackBar: document.getElementById("feedbackBar"),
    arena: document.getElementById("arena"),
    rainLayer: document.getElementById("rainLayer"),
    singleTargetBox: document.getElementById("singleTargetBox"),
    singleTargetText: document.getElementById("singleTargetText"),
    bestScoreValue: document.getElementById("bestScoreValue"),
    totalGamesValue: document.getElementById("totalGamesValue"),
    unlockedValue: document.getElementById("unlockedValue"),
    resultModeLabel: document.getElementById("resultModeLabel"),
    resultScore: document.getElementById("resultScore"),
    resultCorrect: document.getElementById("resultCorrect"),
    resultWrong: document.getElementById("resultWrong"),
    resultAccuracy: document.getElementById("resultAccuracy"),
    resultCombo: document.getElementById("resultCombo"),
    resultBest: document.getElementById("resultBest"),
    statsGames: document.getElementById("statsGames"),
    statsCorrect: document.getElementById("statsCorrect"),
    statsWrong: document.getElementById("statsWrong"),
    statsCombo: document.getElementById("statsCombo"),
    bestRain: document.getElementById("bestRain"),
    bestSprint: document.getElementById("bestSprint"),
    bestSymbol: document.getElementById("bestSymbol"),
    wrongList: document.getElementById("wrongList")
  };

  let selectedMode = "rain";
  let currentView = "home";
  let saveData = loadSaveData();
  let currentGame = null;
  let lastResult = null;
  let rainFrameId = 0;
  let singleModeTimer = 0;

  function defaultSave() {
    return {
      bestScore: 0,
      unlockedLevels: ["basic"],
      lastMode: "rain",
      totalGames: 0,
      totalCorrect: 0,
      totalWrong: 0,
      bestCombo: 0,
      modeStats: {
        rain: { best: 0, playCount: 0 },
        sprint: { best: 0, playCount: 0 },
        symbol: { best: 0, playCount: 0 }
      },
      mostWrong: {}
    };
  }

  function loadSaveData() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return defaultSave();
      const parsed = JSON.parse(raw);
      return normalizeSave(parsed);
    } catch (err) {
      return defaultSave();
    }
  }

  function normalizeSave(input) {
    const fallback = defaultSave();
    const merged = {
      ...fallback,
      ...input,
      modeStats: {
        ...fallback.modeStats,
        ...(input.modeStats || {})
      },
      mostWrong: { ...(input.mostWrong || {}) }
    };
    if (!Array.isArray(merged.unlockedLevels) || merged.unlockedLevels.length === 0) {
      merged.unlockedLevels = ["basic"];
    }
    if (!merged.unlockedLevels.includes("basic")) {
      merged.unlockedLevels.unshift("basic");
    }
    return merged;
  }

  function saveToStorage() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(saveData));
  }

  function pickRandom(list) {
    return list[Math.floor(Math.random() * list.length)];
  }

  function getUnlockedLabels() {
    return unlockRules
      .filter((rule) => saveData.unlockedLevels.includes(rule.key))
      .map((rule) => rule.label);
  }

  function ensureUnlockByScore(score) {
    let changed = false;
    unlockRules.forEach((rule) => {
      if (score >= rule.scoreNeed && !saveData.unlockedLevels.includes(rule.key)) {
        saveData.unlockedLevels.push(rule.key);
        changed = true;
      }
    });
    if (changed) saveToStorage();
  }

  function showView(viewKey) {
    if (!els.views[viewKey]) return;
    Object.entries(els.views).forEach(([key, node]) => {
      node.classList.toggle("active", key === viewKey);
    });
    currentView = viewKey;
  }

  function setSelectedMode(mode) {
    selectedMode = mode;
    els.modeCards.forEach((card) => {
      card.classList.toggle("selected", card.dataset.mode === mode);
    });
  }

  function refreshHomeSummary() {
    els.bestScoreValue.textContent = String(saveData.bestScore);
    els.totalGamesValue.textContent = String(saveData.totalGames);
    els.unlockedValue.textContent = getUnlockedLabels().join(" / ");
  }

  function renderStats() {
    els.statsGames.textContent = String(saveData.totalGames);
    els.statsCorrect.textContent = String(saveData.totalCorrect);
    els.statsWrong.textContent = String(saveData.totalWrong);
    els.statsCombo.textContent = String(saveData.bestCombo);
    els.bestRain.textContent = String(saveData.modeStats.rain.best);
    els.bestSprint.textContent = String(saveData.modeStats.sprint.best);
    els.bestSymbol.textContent = String(saveData.modeStats.symbol.best);

    const topWrong = Object.entries(saveData.mostWrong)
      .sort((a, b) => b[1] - a[1])
      .slice(0, 5);

    els.wrongList.innerHTML = "";
    if (topWrong.length === 0) {
      const li = document.createElement("li");
      li.textContent = "还没有错误记录，继续保持。";
      els.wrongList.appendChild(li);
      return;
    }

    topWrong.forEach(([word, count]) => {
      const li = document.createElement("li");
      li.textContent = `${word}（${count} 次）`;
      els.wrongList.appendChild(li);
    });
  }

  function setFeedback(type, text) {
    els.feedbackBar.classList.remove("good", "bad", "warn");
    if (type) els.feedbackBar.classList.add(type);
    els.feedbackBar.textContent = text;
  }

  function resetFeedback() {
    setFeedback("", "准备开始");
  }

  function resetArena() {
    els.rainLayer.innerHTML = "";
    els.singleTargetBox.classList.add("hidden");
    els.singleTargetText.textContent = "";
  }

  function updateStatusUI() {
    if (!currentGame) return;
    els.scoreValue.textContent = String(currentGame.score);
    els.lifeValue.textContent = String(currentGame.lives);
    els.comboValue.textContent = String(currentGame.combo);
    els.progressValue.textContent = currentGame.progressText;
  }

  function stopGameLoops() {
    if (rainFrameId) {
      cancelAnimationFrame(rainFrameId);
      rainFrameId = 0;
    }
    if (singleModeTimer) {
      clearTimeout(singleModeTimer);
      singleModeTimer = 0;
    }
  }

  function startGame(mode) {
    stopGameLoops();
    resetArena();

    const selected = modes[mode];
    if (!selected) return;

    currentGame = {
      mode,
      paused: false,
      running: true,
      score: 0,
      lives: mode === "rain" ? selected.startLives : 1,
      combo: 0,
      bestCombo: 0,
      correct: 0,
      wrong: 0,
      progressText: mode === "rain" ? "1-1" : `0/${selected.rounds}`,
      startedAt: Date.now(),
      mistakes: {},
      targetWord: "",
      roundsTotal: selected.rounds || 0,
      roundIndex: 0,
      targetStartAt: 0,
      lastFrameAt: 0,
      spawnTimerMs: 0,
      spawnIntervalMs: 1300,
      level: 1,
      nextDropId: 1,
      drops: []
    };

    els.modeLabel.textContent = selected.title;
    els.pauseBtn.textContent = "⏸";
    els.wordInput.value = "";
    updateStatusUI();
    resetFeedback();

    if (mode === "rain") {
      els.rainLayer.style.display = "block";
      els.singleTargetBox.classList.add("hidden");
      setFeedback("", "代码雨开始，输入词条后按回车消除。");
      runRainLoop();
    } else {
      els.rainLayer.style.display = "none";
      els.singleTargetBox.classList.remove("hidden");
      queueNextSingleTarget();
    }

    showView("game");
    els.wordInput.focus();
  }

  function runRainLoop() {
    currentGame.lastFrameAt = performance.now();

    const tick = (timestamp) => {
      if (!currentGame || !currentGame.running || currentGame.mode !== "rain") return;
      if (currentGame.paused) {
        currentGame.lastFrameAt = timestamp;
        rainFrameId = requestAnimationFrame(tick);
        return;
      }

      const deltaSec = Math.min(0.05, (timestamp - currentGame.lastFrameAt) / 1000);
      currentGame.lastFrameAt = timestamp;

      updateRainLevelByScore();
      currentGame.spawnTimerMs += deltaSec * 1000;
      if (currentGame.spawnTimerMs >= currentGame.spawnIntervalMs) {
        spawnDrop();
        currentGame.spawnTimerMs = 0;
      }

      updateDropPositions(deltaSec);
      updateStatusUI();
      rainFrameId = requestAnimationFrame(tick);
    };

    rainFrameId = requestAnimationFrame(tick);
  }

  function getRainPoolByLevel(level) {
    if (!currentGame) return pools.basic;
    if (level === 1) return pools.basic;
    if (level === 2) return [...pools.basic, ...pools.keyword];
    return [...pools.basic, ...pools.keyword, ...pools.symbol];
  }

  function updateRainLevelByScore() {
    if (!currentGame || currentGame.mode !== "rain") return;
    let nextLevel = 1;
    if (currentGame.score >= 550) nextLevel = 3;
    else if (currentGame.score >= 220) nextLevel = 2;

    if (nextLevel !== currentGame.level) {
      currentGame.level = nextLevel;
      if (nextLevel === 2) {
        currentGame.spawnIntervalMs = 980;
        setFeedback("warn", "进入 2-1：掉落速度提升。");
      } else if (nextLevel === 3) {
        currentGame.spawnIntervalMs = 760;
        setFeedback("warn", "进入 3-1：符号词条加入。");
      }
    }

    currentGame.progressText = `${currentGame.level}-1`;
  }

  function spawnDrop() {
    if (!currentGame || currentGame.mode !== "rain") return;
    const arenaWidth = els.arena.clientWidth;
    const pool = getRainPoolByLevel(currentGame.level);
    const word = pickRandom(pool);
    const dropEl = document.createElement("div");
    const speedBase = currentGame.level === 1 ? 55 : currentGame.level === 2 ? 75 : 95;
    const speed = speedBase + Math.random() * 28;
    const left = Math.max(6, Math.random() * (arenaWidth - 120));

    dropEl.className = "drop-word";
    dropEl.textContent = word;
    dropEl.style.left = `${left}px`;
    dropEl.style.top = "0";

    const drop = {
      id: currentGame.nextDropId++,
      text: word,
      y: -46,
      speed,
      el: dropEl
    };

    currentGame.drops.push(drop);
    els.rainLayer.appendChild(dropEl);
  }

  function removeDrop(drop) {
    const idx = currentGame.drops.findIndex((item) => item.id === drop.id);
    if (idx >= 0) currentGame.drops.splice(idx, 1);
    if (drop.el && drop.el.parentNode) drop.el.parentNode.removeChild(drop.el);
  }

  function updateDropPositions(deltaSec) {
    if (!currentGame || currentGame.mode !== "rain") return;
    const arenaHeight = els.arena.clientHeight;
    const missed = [];

    currentGame.drops.forEach((drop) => {
      drop.y += drop.speed * deltaSec;
      drop.el.style.transform = `translateY(${drop.y}px)`;
      if (drop.y >= arenaHeight - 52) missed.push(drop);
    });

    missed.forEach((drop) => {
      markWrong(drop.text);
      removeDrop(drop);
      currentGame.wrong += 1;
      currentGame.combo = 0;
      currentGame.lives -= 1;
      setFeedback("bad", `漏掉 ${drop.text}，生命 -1`);
      if (currentGame.lives <= 0) endGame();
    });
  }

  function calcRainGain() {
    const comboBonus = Math.min(10, Math.floor(currentGame.combo / 2) * 2);
    return modes.rain.baseScore + comboBonus;
  }

  function submitCurrentInput() {
    if (!currentGame || !currentGame.running || currentGame.paused) return;
    const answer = els.wordInput.value.trim();
    if (!answer) return;
    els.wordInput.value = "";

    if (currentGame.mode === "rain") {
      handleRainInput(answer);
      return;
    }

    handleSingleInput(answer);
  }

  function handleRainInput(answer) {
    const candidates = currentGame.drops.filter((drop) => drop.text === answer);
    if (candidates.length === 0) {
      currentGame.wrong += 1;
      currentGame.combo = 0;
      currentGame.lives -= 1;
      markWrong(answer);
      setFeedback("bad", `没有匹配目标：${answer}，生命 -1`);
      updateStatusUI();
      if (currentGame.lives <= 0) endGame();
      return;
    }

    candidates.sort((a, b) => b.y - a.y);
    const hit = candidates[0];
    currentGame.combo += 1;
    currentGame.bestCombo = Math.max(currentGame.bestCombo, currentGame.combo);
    currentGame.correct += 1;
    const gain = calcRainGain();
    currentGame.score += gain;
    hit.el.classList.add("hit");
    removeDrop(hit);
    setFeedback("good", `命中 ${answer}，+${gain}`);
    updateStatusUI();
  }

  function getSingleModePool(mode) {
    if (mode === "sprint") return [...pools.basic, ...pools.keyword];
    return pools.symbol;
  }

  function queueNextSingleTarget() {
    if (!currentGame || !currentGame.running) return;
    if (currentGame.roundIndex >= currentGame.roundsTotal) {
      endGame();
      return;
    }

    const pool = getSingleModePool(currentGame.mode);
    currentGame.targetWord = pickRandom(pool);
    currentGame.roundIndex += 1;
    currentGame.targetStartAt = Date.now();
    currentGame.progressText = `${currentGame.roundIndex}/${currentGame.roundsTotal}`;
    els.singleTargetText.textContent = currentGame.targetWord;
    updateStatusUI();

    const modeHint = currentGame.mode === "sprint"
      ? "越快输入，额外分越高。"
      : "符号要一字不差，保持连击。";
    setFeedback("", modeHint);
  }

  function handleSingleInput(answer) {
    const target = currentGame.targetWord;
    const elapsedSec = (Date.now() - currentGame.targetStartAt) / 1000;

    if (answer === target) {
      currentGame.correct += 1;
      currentGame.combo += 1;
      currentGame.bestCombo = Math.max(currentGame.bestCombo, currentGame.combo);

      let gain = modes[currentGame.mode].baseScore;
      if (currentGame.mode === "sprint") {
        const speedBonus = Math.max(0, 12 - Math.floor(elapsedSec * 2));
        gain += speedBonus;
        setFeedback("good", `正确，耗时 ${elapsedSec.toFixed(2)}s，+${gain}`);
      } else {
        const comboBonus = Math.min(12, Math.floor(currentGame.combo / 2) * 2);
        gain += comboBonus;
        setFeedback("good", `符号命中，+${gain}`);
      }
      currentGame.score += gain;
    } else {
      currentGame.wrong += 1;
      currentGame.combo = 0;
      markWrong(target);
      setFeedback("bad", `错误，目标是 ${target}`);
    }

    updateStatusUI();
    singleModeTimer = setTimeout(() => {
      queueNextSingleTarget();
      els.wordInput.focus();
    }, 320);
  }

  function togglePause() {
    if (!currentGame || !currentGame.running) return;
    currentGame.paused = !currentGame.paused;
    els.pauseBtn.textContent = currentGame.paused ? "▶" : "⏸";
    if (currentGame.paused) {
      setFeedback("warn", "已暂停，点击继续。");
    } else if (currentGame.mode === "rain") {
      setFeedback("", "继续战斗。");
    } else {
      setFeedback("", "继续输入当前目标。");
    }
    els.wordInput.focus();
  }

  function endGame() {
    if (!currentGame || !currentGame.running) return;
    currentGame.running = false;
    stopGameLoops();

    if (currentGame.mode === "rain") {
      currentGame.drops.forEach((drop) => {
        if (drop.el && drop.el.parentNode) drop.el.parentNode.removeChild(drop.el);
      });
      currentGame.drops = [];
    }

    const totalAnswers = currentGame.correct + currentGame.wrong;
    const accuracy = totalAnswers > 0
      ? Math.round((currentGame.correct / totalAnswers) * 100)
      : 0;

    updateSaveByResult(currentGame);
    ensureUnlockByScore(saveData.modeStats.rain.best);
    saveToStorage();
    refreshHomeSummary();
    renderStats();

    lastResult = {
      mode: currentGame.mode,
      score: currentGame.score,
      correct: currentGame.correct,
      wrong: currentGame.wrong,
      accuracy,
      bestCombo: currentGame.bestCombo,
      globalBest: saveData.bestScore
    };

    renderResult(lastResult);
    currentGame = null;
    showView("result");
  }

  function updateSaveByResult(game) {
    saveData.totalGames += 1;
    saveData.totalCorrect += game.correct;
    saveData.totalWrong += game.wrong;
    saveData.bestScore = Math.max(saveData.bestScore, game.score);
    saveData.bestCombo = Math.max(saveData.bestCombo, game.bestCombo);
    saveData.lastMode = game.mode;
    saveData.modeStats[game.mode].playCount += 1;
    saveData.modeStats[game.mode].best = Math.max(saveData.modeStats[game.mode].best, game.score);
  }

  function renderResult(result) {
    els.resultModeLabel.textContent = modes[result.mode].title;
    els.resultScore.textContent = String(result.score);
    els.resultCorrect.textContent = String(result.correct);
    els.resultWrong.textContent = String(result.wrong);
    els.resultAccuracy.textContent = `${result.accuracy}%`;
    els.resultCombo.textContent = String(result.bestCombo);
    els.resultBest.textContent = String(result.globalBest);
  }

  function markWrong(word) {
    if (!word) return;
    saveData.mostWrong[word] = (saveData.mostWrong[word] || 0) + 1;
  }

  function bindEvents() {
    els.modeCards.forEach((card) => {
      card.addEventListener("click", () => {
        setSelectedMode(card.dataset.mode);
      });
    });

    els.startGameBtn.addEventListener("click", () => {
      startGame(selectedMode);
    });

    els.openStatsBtn.addEventListener("click", () => {
      renderStats();
      showView("stats");
    });

    els.closeStatsBtn.addEventListener("click", () => {
      showView("home");
    });

    els.retryBtn.addEventListener("click", () => {
      const mode = lastResult ? lastResult.mode : selectedMode;
      startGame(mode);
    });

    els.goHomeBtn.addEventListener("click", () => {
      showView("home");
    });

    els.backHomeBtn.addEventListener("click", () => {
      if (!currentGame || !currentGame.running) {
        showView("home");
        return;
      }
      const ok = window.confirm("当前对局将结束并返回首页，确认吗？");
      if (!ok) return;
      currentGame.running = false;
      stopGameLoops();
      currentGame = null;
      resetArena();
      showView("home");
    });

    els.pauseBtn.addEventListener("click", togglePause);
    els.inputForm.addEventListener("submit", (event) => {
      event.preventDefault();
      submitCurrentInput();
      els.wordInput.focus();
    });
  }

  function init() {
    ensureUnlockByScore(saveData.modeStats.rain.best);
    refreshHomeSummary();
    renderStats();
    if (saveData.lastMode && modes[saveData.lastMode]) {
      setSelectedMode(saveData.lastMode);
    } else {
      setSelectedMode("rain");
    }
    showView(currentView);
    bindEvents();
  }

  init();
})();

  </script>
</body>
</html>
