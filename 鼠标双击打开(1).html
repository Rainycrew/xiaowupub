<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PyPuzzle Lite - Python 代码拼图</title>
  <style>
    :root {
  --bg-0: #eef3ff;
  --bg-1: #f8fbff;
  --panel: rgba(255, 255, 255, 0.9);
  --line: #d9e3f6;
  --text: #17315f;
  --muted: #6077a3;
  --primary: #2f7df3;
  --primary-strong: #1f64d1;
  --primary-soft: #dcecff;
  --success: #29b396;
  --error: #f04f65;
  --warn: #f6a623;
  --shadow: 0 18px 40px rgba(22, 53, 108, 0.12);
  --radius-lg: 20px;
  --radius-md: 14px;
  --radius-sm: 10px;
  --font-ui: "Source Han Sans SC", "Noto Sans SC", "Microsoft YaHei UI", sans-serif;
  --font-code: "JetBrains Mono", "Fira Code", "Cascadia Mono", "Consolas", monospace;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  color: var(--text);
  font-family: var(--font-ui);
  background:
    radial-gradient(circle at 12% 18%, rgba(129, 177, 255, 0.32), transparent 45%),
    radial-gradient(circle at 85% 12%, rgba(97, 181, 227, 0.2), transparent 42%),
    linear-gradient(160deg, var(--bg-0), var(--bg-1));
}

body.is-sorting {
  user-select: none;
  cursor: grabbing;
}

.app-wrap {
  max-width: 460px;
  min-height: 100vh;
  margin: 0 auto;
  padding: 18px 14px 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.brand-bar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px;
  border-radius: 18px;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.94), rgba(242, 248, 255, 0.85));
  border: 1px solid rgba(227, 236, 252, 0.9);
  box-shadow: var(--shadow);
  animation: enter-up 0.35s ease both;
}

.logo-mark {
  width: 44px;
  height: 44px;
  border-radius: 14px;
  display: grid;
  place-items: center;
  font-weight: 800;
  color: #ffffff;
  background: linear-gradient(135deg, #4587ff, #38b4de);
}

.brand-copy {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.brand-copy strong {
  font-size: 30px;
  line-height: 1;
  letter-spacing: 0.3px;
}

.brand-copy span {
  color: var(--muted);
  font-size: 13px;
}

.brand-chip {
  margin-left: auto;
  padding: 5px 10px;
  border-radius: 999px;
  font-size: 12px;
  color: var(--primary-strong);
  background: var(--primary-soft);
}

.view-stack {
  flex: 1;
}

.view {
  display: none;
  gap: 12px;
}

.view.is-active {
  display: flex;
  flex-direction: column;
}

.panel {
  padding: 16px;
  border-radius: var(--radius-lg);
  background: var(--panel);
  border: 1px solid rgba(226, 235, 249, 0.95);
  box-shadow: var(--shadow);
  backdrop-filter: blur(6px);
  animation: enter-up 0.35s ease both;
}

.view.is-active .panel:nth-child(2) {
  animation-delay: 0.05s;
}

.view.is-active .panel:nth-child(3) {
  animation-delay: 0.1s;
}

.view.is-active .panel:nth-child(4) {
  animation-delay: 0.15s;
}

h1,
h2,
h3,
p {
  margin: 0;
}

h1 {
  font-size: 34px;
  line-height: 1.15;
}

h2 {
  font-size: 24px;
  line-height: 1.2;
}

.hero-panel {
  position: relative;
  overflow: hidden;
  background:
    linear-gradient(145deg, rgba(255, 255, 255, 0.93), rgba(234, 244, 255, 0.88));
}

.hero-panel::after {
  content: "";
  position: absolute;
  width: 180px;
  height: 180px;
  right: -80px;
  top: -75px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(56, 124, 241, 0.14), transparent 66%);
}

.hero-panel p {
  margin-top: 10px;
  color: var(--muted);
  line-height: 1.5;
}

.hero-actions {
  margin-top: 16px;
  display: grid;
  gap: 10px;
}

.btn,
.nav-btn,
.line-btn,
.text-btn,
.icon-btn {
  font: inherit;
}

.btn {
  width: 100%;
  border: 0;
  border-radius: var(--radius-sm);
  padding: 13px 16px;
  font-weight: 700;
  font-size: 22px;
  cursor: pointer;
  transition: transform 0.15s ease, filter 0.15s ease;
}

.btn:active,
.nav-btn:active,
.line-btn:active,
.icon-btn:active {
  transform: translateY(1px);
}

.btn-primary {
  color: #ffffff;
  background: linear-gradient(130deg, var(--primary), var(--primary-strong));
  box-shadow: 0 12px 22px rgba(48, 119, 236, 0.3);
}

.btn-primary-light {
  color: var(--primary-strong);
  background: linear-gradient(130deg, #e6f1ff, #d6e8ff);
  border: 1px solid #bdd6ff;
}

.btn-ghost {
  color: var(--text);
  background: #f8fbff;
  border: 1px solid var(--line);
}

.btn:disabled {
  filter: grayscale(0.3);
  cursor: not-allowed;
  opacity: 0.6;
}

.panel-head {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.panel-head.between {
  flex-direction: row;
  justify-content: space-between;
  align-items: center;
}

.muted-text {
  color: var(--muted);
  font-size: 14px;
}

.category-grid {
  margin-top: 14px;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}

.category-card {
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: 12px;
  background: #f8fbff;
  text-align: left;
  cursor: pointer;
  transition: border-color 0.15s ease, background 0.15s ease;
}

.category-card strong {
  display: block;
  font-size: 20px;
  margin-bottom: 4px;
}

.category-card p,
.category-card small {
  color: var(--muted);
  line-height: 1.4;
}

.category-card small {
  display: block;
  margin-top: 6px;
  font-size: 14px;
}

.category-card.is-active {
  border-color: #8cb5ff;
  background: linear-gradient(140deg, #f7fbff, #e8f1ff);
}

.progress-list {
  margin: 12px 0 0;
  padding: 0;
  list-style: none;
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  overflow: hidden;
}

.progress-list li {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 14px;
  background: #fbfdff;
}

.progress-list li + li {
  border-top: 1px solid var(--line);
}

.progress-list span {
  color: var(--muted);
}

.progress-list strong {
  font-size: 24px;
}

.banner {
  padding: 12px 14px;
  border-radius: var(--radius-md);
  font-size: 15px;
  line-height: 1.45;
}

.banner.info {
  border: 1px solid #bfd9ff;
  background: #ecf4ff;
  color: #285cae;
}

.banner.warn {
  border: 1px solid #ffd58f;
  background: #fff6e5;
  color: #9f6716;
}

.puzzle-head-top {
  display: flex;
  align-items: center;
  gap: 10px;
}

.icon-btn {
  width: 42px;
  height: 42px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: #f7fbff;
  color: var(--primary-strong);
  font-size: 22px;
  cursor: pointer;
}

.stage-label {
  color: var(--muted);
  font-size: 14px;
}

.puzzle-description {
  margin-top: 12px;
  color: #2b4578;
  line-height: 1.6;
}

.code-list {
  display: grid;
  gap: 10px;
}

.code-card {
  border: 1px solid #d7e4fa;
  border-radius: var(--radius-md);
  background: linear-gradient(180deg, #fcfdff, #f4f8ff);
  padding: 12px 12px;
  transition: border-color 0.15s ease, box-shadow 0.15s ease, transform 0.15s ease;
  cursor: grab;
  touch-action: none;
}

.code-card.is-wrong {
  border-color: #ff9ca8;
  background: linear-gradient(180deg, #fff9fb, #fff1f4);
}

.code-card.is-dragging {
  border-color: #86b2ff;
  box-shadow: 0 14px 24px rgba(70, 127, 226, 0.2);
  transform: translateY(-1px);
  cursor: grabbing;
}

.code-row {
  display: flex;
  gap: 10px;
  align-items: center;
}

.line-no {
  min-width: 54px;
  font-size: 12px;
  color: var(--muted);
  font-weight: 700;
}

.code-line {
  margin: 0;
  white-space: pre-wrap;
  word-break: break-all;
  font-size: 20px;
  line-height: 1.45;
  font-family: var(--font-code);
  flex: 1;
}

.hint-box {
  margin-top: 12px;
  border: 1px dashed #9fc0f6;
  border-radius: 12px;
  background: #eff6ff;
  color: #3562a9;
  text-align: center;
  padding: 12px;
  font-size: 15px;
}

.hint-box.warn {
  border-color: #f7c880;
  background: #fff4e3;
  color: #a86a15;
}

.action-panel {
  display: grid;
  gap: 10px;
}

.small-meta {
  margin: 0;
  color: var(--muted);
  font-size: 14px;
  text-align: center;
}

.result-panel {
  text-align: center;
}

.result-panel.is-success {
  border-color: #b5eadf;
  background: linear-gradient(150deg, rgba(250, 255, 253, 0.94), rgba(237, 252, 248, 0.9));
}

.result-panel.is-fail {
  border-color: #ffcad2;
  background: linear-gradient(150deg, rgba(255, 252, 253, 0.94), rgba(255, 243, 245, 0.9));
}

.result-tag {
  display: inline-block;
  padding: 6px 10px;
  border-radius: 999px;
  font-size: 13px;
  margin-bottom: 8px;
}

.result-panel.is-success .result-tag {
  color: #127a65;
  background: #dbf7f0;
}

.result-panel.is-fail .result-tag {
  color: #b33144;
  background: #ffe2e7;
}

.result-subtitle {
  margin-top: 8px;
  color: #36517f;
  line-height: 1.5;
}

.result-code-list {
  margin-top: 14px;
  padding: 12px;
  border: 1px solid #d5e3fb;
  border-radius: var(--radius-md);
  background: #f8fbff;
  text-align: left;
  display: grid;
  gap: 6px;
}

.result-line {
  padding: 6px 8px;
  border-radius: 8px;
  font-family: var(--font-code);
  font-size: 18px;
  white-space: pre-wrap;
  word-break: break-all;
}

.result-line.is-wrong {
  background: rgba(240, 79, 101, 0.12);
  color: #a72d40;
}

.explain-box {
  margin-top: 12px;
  padding: 12px;
  border-radius: 12px;
  border: 1px solid #cee0fb;
  background: #edf5ff;
  text-align: left;
  color: #264b8a;
  line-height: 1.55;
}

.result-actions {
  margin-top: 14px;
  display: grid;
  gap: 8px;
}

.stats-grid {
  margin-top: 12px;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}

.stat-card {
  border: 1px solid #d4e3fc;
  border-radius: 12px;
  background: #f9fcff;
  padding: 12px;
}

.stat-card b {
  display: block;
  font-size: 24px;
}

.stat-card span {
  color: var(--muted);
  font-size: 13px;
}

.category-progress-list {
  margin-top: 10px;
  display: grid;
  gap: 10px;
}

.category-progress-item {
  border: 1px solid #d6e4fb;
  border-radius: 12px;
  background: #f8fbff;
  padding: 10px;
}

.category-progress-item .row {
  display: flex;
  justify-content: space-between;
  font-size: 14px;
  margin-bottom: 6px;
}

.progress-bar {
  height: 9px;
  border-radius: 999px;
  background: #e7efff;
  overflow: hidden;
}

.progress-bar > span {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(120deg, #3f8cff, #3ac2e5);
}

.wrong-list {
  margin-top: 10px;
  display: grid;
  gap: 8px;
}

.wrong-item {
  width: 100%;
  border: 1px solid #ffd0d7;
  border-radius: 12px;
  background: #fff8f9;
  color: #7a2f3b;
  text-align: left;
  padding: 10px;
  cursor: pointer;
}

.wrong-item strong {
  display: block;
  margin-bottom: 3px;
  font-size: 16px;
}

.wrong-item span {
  color: #a94c5b;
  font-size: 13px;
}

.empty {
  margin: 0;
  color: var(--muted);
  font-size: 14px;
}

.text-btn {
  border: 0;
  background: transparent;
  color: var(--primary-strong);
  font-size: 14px;
  cursor: pointer;
  padding: 0;
}

.bottom-nav {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
  position: sticky;
  bottom: 10px;
  padding: 8px;
  border-radius: 15px;
  border: 1px solid rgba(221, 232, 251, 0.95);
  background: rgba(248, 252, 255, 0.95);
  box-shadow: 0 10px 24px rgba(28, 63, 126, 0.13);
  backdrop-filter: blur(10px);
}

.nav-btn {
  border: 0;
  border-radius: 10px;
  padding: 9px 8px;
  background: transparent;
  color: #5a71a0;
  font-weight: 700;
  cursor: pointer;
}

.nav-btn:hover {
  background: #e9f2ff;
}

.nav-btn.is-active {
  color: #ffffff;
  background: linear-gradient(130deg, #2f7df3, #1f64d1);
}

@media (min-width: 960px) {
  body {
    padding: 22px 18px;
  }

  .app-wrap {
    max-width: 1340px;
    min-height: calc(100vh - 44px);
    padding: 18px 20px 20px;
    gap: 18px;
    border-radius: 26px;
    background: rgba(244, 249, 255, 0.58);
    border: 1px solid rgba(220, 232, 252, 0.92);
    box-shadow: 0 26px 56px rgba(18, 49, 98, 0.16);
  }

  .brand-bar {
    padding: 16px 20px;
    border-radius: 20px;
  }

  .panel {
    padding: 20px;
    border-radius: 18px;
  }

  .hero-actions {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .category-card strong {
    font-size: 18px;
  }

  .progress-list strong {
    font-size: 20px;
  }

  #view-home.is-active {
    display: grid;
    grid-template-columns: minmax(0, 1.3fr) minmax(330px, 0.9fr);
    grid-template-areas:
      "hero progress"
      "category progress"
      "banner banner";
    align-items: stretch;
    gap: 14px;
  }

  #home-hero {
    grid-area: hero;
  }

  #home-category {
    grid-area: category;
  }

  #home-progress {
    grid-area: progress;
    height: 100%;
    display: flex;
    flex-direction: column;
  }

  #home-banner {
    grid-area: banner;
  }

  #view-puzzle.is-active {
    display: grid;
    grid-template-columns: minmax(0, 1.55fr) minmax(310px, 0.85fr);
    grid-template-areas:
      "head actions"
      "workspace actions";
    align-items: start;
    gap: 14px;
  }

  #puzzle-head {
    grid-area: head;
  }

  #puzzle-workspace {
    grid-area: workspace;
    min-height: 540px;
    display: flex;
    flex-direction: column;
  }

  #puzzle-workspace .code-list {
    max-height: 445px;
    overflow: auto;
    padding-right: 4px;
  }

  #puzzle-actions {
    grid-area: actions;
    position: sticky;
    top: 14px;
    align-self: start;
    gap: 12px;
  }

  #puzzle-actions .small-meta {
    margin-top: 2px;
  }

  #view-result.is-active {
    max-width: 860px;
    margin: 0 auto;
  }

  #view-stats.is-active {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    grid-template-areas:
      "summary categories"
      "wrong wrong";
    gap: 14px;
  }

  .stats-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  #stats-summary {
    grid-area: summary;
  }

  #stats-categories {
    grid-area: categories;
  }

  #stats-wrong {
    grid-area: wrong;
  }

  .bottom-nav {
    position: static;
    max-width: 560px;
    width: 100%;
    margin: 0 auto;
  }

  .btn {
    font-size: 19px;
  }

  .code-line {
    font-size: 21px;
  }
}

@media (max-width: 520px) {
  .app-wrap {
    max-width: 100%;
    padding: 12px 10px 16px;
  }

  h1 {
    font-size: 30px;
  }

  h2 {
    font-size: 21px;
  }

  .brand-copy strong {
    font-size: 26px;
  }

  .btn {
    font-size: 20px;
    padding: 12px 14px;
  }

  .category-grid {
    grid-template-columns: 1fr;
  }

  .code-line,
  .result-line {
    font-size: 18px;
  }
}

@media (prefers-reduced-motion: reduce) {
  * {
    animation: none !important;
    transition: none !important;
  }
}

@keyframes enter-up {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

  </style>
</head>
<body>
  <div class="app-wrap">
    <header class="brand-bar">
      <div class="logo-mark" aria-hidden="true">Py</div>
      <div class="brand-copy">
        <strong>PyPuzzle</strong>
        <span>Python 代码拼图</span>
      </div>
      <div class="brand-chip">Lite</div>
    </header>

    <main class="view-stack">
      <section id="view-home" class="view is-active">
        <article id="home-hero" class="panel hero-panel">
          <h1>Python 代码拼图</h1>
          <p>把打乱的代码拼回正确顺序，边玩边理解 Python。</p>
          <div class="hero-actions">
            <button id="start-btn" class="btn btn-primary" type="button">开始闯关</button>
            <button id="continue-btn" class="btn btn-ghost" type="button">继续上次练习</button>
          </div>
        </article>

        <article id="home-category" class="panel">
          <div class="panel-head between">
            <h2>选择练习类型</h2>
            <span id="selected-category-text" class="muted-text"></span>
          </div>
          <div id="category-grid" class="category-grid"></div>
        </article>

        <article id="home-progress" class="panel">
          <h2>当前进度</h2>
          <ul class="progress-list">
            <li><span>已完成</span><strong id="summary-completed">0 题</strong></li>
            <li><span>当前关卡</span><strong id="summary-category">全部题目</strong></li>
            <li><span>当前连胜</span><strong id="summary-streak">0 题</strong></li>
            <li><span>最高连胜</span><strong id="summary-best-streak">0 题</strong></li>
          </ul>
        </article>

        <div id="home-banner" class="banner" hidden></div>
      </section>

      <section id="view-puzzle" class="view">
        <article id="puzzle-head" class="panel puzzle-head">
          <div class="puzzle-head-top">
            <button id="puzzle-back-btn" class="icon-btn" type="button" aria-label="返回首页">←</button>
            <div>
              <p id="puzzle-stage" class="stage-label">输入输出练习</p>
              <h2 id="puzzle-title">第 1 题</h2>
            </div>
          </div>
          <p id="puzzle-description" class="puzzle-description"></p>
        </article>

        <article id="puzzle-workspace" class="panel">
          <div id="code-list" class="code-list"></div>
          <div id="puzzle-hint" class="hint-box">按住任意代码卡片拖动排序，然后点击提交。</div>
        </article>

        <article id="puzzle-actions" class="panel action-panel">
          <button id="submit-btn" class="btn btn-primary" type="button">提交</button>
          <button id="reset-btn" class="btn btn-ghost" type="button">重置</button>
          <p id="puzzle-progress-text" class="small-meta">进度：1 / 20</p>
        </article>
      </section>

      <section id="view-result" class="view">
        <article id="result-panel" class="panel result-panel is-success">
          <span id="result-status-tag" class="result-tag">拼图成功</span>
          <h2 id="result-title">拼图成功！</h2>
          <p id="result-subtitle" class="result-subtitle"></p>

          <div id="result-code-list" class="result-code-list"></div>
          <div id="result-explanation" class="explain-box"></div>
          <p id="result-extra" class="small-meta"></p>

          <div class="result-actions">
            <button id="next-btn" class="btn btn-primary" type="button">下一题</button>
            <button id="retry-btn" class="btn btn-primary-light" type="button">再试一次</button>
            <button id="result-reset-btn" class="btn btn-ghost" type="button">重置顺序</button>
            <button id="home-btn" class="btn btn-ghost" type="button">返回首页</button>
          </div>
        </article>
      </section>

      <section id="view-stats" class="view">
        <article id="stats-summary" class="panel">
          <h2>学习统计</h2>
          <div id="stats-grid" class="stats-grid"></div>
        </article>

        <article id="stats-categories" class="panel">

  <script >
    (function (global) {
  "use strict";

  var STORAGE_KEY = "pypuzzle-lite-state-v1";
  var memoryFallback = null;

  function defaultState() {
    return {
      version: 1,
      currentPuzzleId: 1,
      completedPuzzles: [],
      currentCategory: "all",
      streak: 0,
      bestStreak: 0,
      wrongPuzzleIds: [],
      totalAttempts: 0,
      totalCorrect: 0,
      lastSessionAt: null
    };
  }

  function toInt(value, fallback) {
    var n = Number(value);
    if (!Number.isFinite(n) || n < 0) {
      return fallback;
    }
    return Math.floor(n);
  }

  function toUniqueNumberArray(value) {
    if (!Array.isArray(value)) {
      return [];
    }
    var seen = {};
    var out = [];
    for (var i = 0; i < value.length; i += 1) {
      var n = Number(value[i]);
      if (Number.isFinite(n) && n > 0) {
        n = Math.floor(n);
        if (!seen[n]) {
          seen[n] = true;
          out.push(n);
        }
      }
    }
    return out;
  }

  function sanitizeState(raw) {
    var base = defaultState();
    if (!raw || typeof raw !== "object") {
      return base;
    }

    base.currentPuzzleId = toInt(raw.currentPuzzleId, 1);
    base.completedPuzzles = toUniqueNumberArray(raw.completedPuzzles);
    base.currentCategory = typeof raw.currentCategory === "string" ? raw.currentCategory : "all";
    base.streak = toInt(raw.streak, 0);
    base.bestStreak = toInt(raw.bestStreak, 0);
    base.wrongPuzzleIds = toUniqueNumberArray(raw.wrongPuzzleIds);
    base.totalAttempts = toInt(raw.totalAttempts, 0);
    base.totalCorrect = toInt(raw.totalCorrect, 0);
    base.lastSessionAt = typeof raw.lastSessionAt === "string" ? raw.lastSessionAt : null;

    if (base.bestStreak < base.streak) {
      base.bestStreak = base.streak;
    }

    return base;
  }

  function parseStored(rawText) {
    if (!rawText) {
      return null;
    }
    try {
      return JSON.parse(rawText);
    } catch (error) {
      return null;
    }
  }

  function loadState() {
    var raw = null;
    try {
      raw = global.localStorage.getItem(STORAGE_KEY);
    } catch (error) {
      raw = memoryFallback;
    }

    if (!raw) {
      return defaultState();
    }

    return sanitizeState(parseStored(raw));
  }

  function saveState(nextState) {
    var safe = sanitizeState(nextState);
    var text = JSON.stringify(safe);
    try {
      global.localStorage.setItem(STORAGE_KEY, text);
    } catch (error) {
      memoryFallback = text;
    }
    return safe;
  }

  function clearState() {
    try {
      global.localStorage.removeItem(STORAGE_KEY);
    } catch (error) {
      memoryFallback = null;
    }
  }

  global.PyPuzzleStorage = {
    key: STORAGE_KEY,
    defaultState: defaultState,
    loadState: loadState,
    saveState: saveState,
    clearState: clearState
  };
})(window);
  </script>
  <script >
    (function (global) {
  "use strict";

  function areSameOrder(a, b) {
    if (!Array.isArray(a) || !Array.isArray(b) || a.length !== b.length) {
      return false;
    }
    for (var i = 0; i < a.length; i += 1) {
      if (a[i] !== b[i]) {
        return false;
      }
    }
    return true;
  }

  function fisherYates(items) {
    for (var i = items.length - 1; i > 0; i -= 1) {
      var j = Math.floor(Math.random() * (i + 1));
      var temp = items[i];
      items[i] = items[j];
      items[j] = temp;
    }
  }

  function shuffleLines(lines) {
    var base = Array.isArray(lines) ? lines.slice() : [];
    if (base.length < 2) {
      return base;
    }

    var shuffled = base.slice();
    var attempts = 0;
    while (areSameOrder(base, shuffled) && attempts < 8) {
      fisherYates(shuffled);
      attempts += 1;
    }

    return shuffled;
  }

  function moveItem(order, fromIndex, toIndex) {
    if (!Array.isArray(order)) {
      return [];
    }

    var next = order.slice();
    if (
      fromIndex < 0 ||
      fromIndex >= next.length ||
      toIndex < 0 ||
      toIndex >= next.length ||
      fromIndex === toIndex
    ) {
      return next;
    }

    var moved = next.splice(fromIndex, 1)[0];
    next.splice(toIndex, 0, moved);

    return next;
  }

  function moveLine(order, index, direction) {
    var target = direction === "up" ? index - 1 : index + 1;
    return moveItem(order, index, target);
  }

  function checkOrder(currentOrder, correctOrder) {
    var mismatchIndexes = [];
    var maxLength = Math.max(currentOrder.length, correctOrder.length);

    for (var i = 0; i < maxLength; i += 1) {
      if (currentOrder[i] !== correctOrder[i]) {
        mismatchIndexes.push(i);
      }
    }

    return {
      isCorrect: mismatchIndexes.length === 0,
      mismatchIndexes: mismatchIndexes
    };
  }

  global.PyPuzzleEngine = {
    shuffleLines: shuffleLines,
    moveItem: moveItem,
    moveLine: moveLine,
    checkOrder: checkOrder,
    areSameOrder: areSameOrder
  };
})(window);

    });
  }

  function getPuzzleById(puzzleId) {
    for (var i = 0; i < puzzles.length; i += 1) {
      if (puzzles[i].id === puzzleId) {
        return puzzles[i];
      }
    }
    return null;
  }

  function categoryLabel(categoryKey) {
    return categoryMap[categoryKey] ? categoryMap[categoryKey].label : "全部题目";
  }

  function startPractice() {
    var target = findStartPuzzleId(app.selectedCategory);
    if (!target) {
      setBanner("当前分类没有可练习题目。", "warn");
      return;
    }
    openPuzzle(target.id, true);
  }

  function continuePractice() {
    var targetId = app.state.currentPuzzleId;
    var list = getPuzzlesByCategory(app.selectedCategory);

    if (!list.length) {
      setBanner("当前分类暂无题目。", "warn");
      showView("home");
      return;
    }

    var found = list.some(function (item) {
      return item.id === targetId;
    });

    if (!found) {
      targetId = findStartPuzzleId(app.selectedCategory).id;
    }

    openPuzzle(targetId, false);
  }

  function findStartPuzzleId(categoryKey) {
    var list = getPuzzlesByCategory(categoryKey);
    if (!list.length) {
      return null;
    }

    var completed = toLookup(app.state.completedPuzzles);
    for (var i = 0; i < list.length; i += 1) {
      if (!completed[list[i].id]) {
        return list[i];
      }
    }

    return list[0];
  }

  function openPuzzle(puzzleId, forceShuffle) {
    cancelDrag();

    var puzzle = getPuzzleById(puzzleId);
    if (!puzzle) {
      setBanner("目标题目不存在。", "warn");
      showView("home");
      return;
    }

    var changedPuzzle = !app.currentPuzzle || app.currentPuzzle.id !== puzzle.id;
    app.currentPuzzle = puzzle;

    if (forceShuffle || changedPuzzle || app.workingOrder.length !== puzzle.correctOrder.length) {
      app.initialOrder = engine.shuffleLines(puzzle.correctOrder);
      app.workingOrder = app.initialOrder.slice();
    }

    app.state.currentPuzzleId = puzzle.id;
    app.state.currentCategory = app.selectedCategory;
    app.state.lastSessionAt = new Date().toISOString();
    persistState();

    renderPuzzle();
    showView("puzzle");
  }

  function renderHome() {
    renderCategoryGrid();

    el.selectedCategoryText.textContent = "当前: " + categoryLabel(app.selectedCategory);
    el.summaryCompleted.textContent = app.state.completedPuzzles.length + " / " + puzzles.length;
    el.summaryCategory.textContent = categoryLabel(app.selectedCategory);
    el.summaryStreak.textContent = app.state.streak + " 题";
    el.summaryBestStreak.textContent = app.state.bestStreak + " 题";

    var hasRecord = !!app.state.lastSessionAt;
    el.continueBtn.disabled = !hasRecord;
    el.continueBtn.textContent = hasRecord ? "继续上次练习" : "继续上次练习（暂无记录）";
  }

  function renderCategoryGrid() {
    var completed = toLookup(app.state.completedPuzzles);
    var html = categories
      .map(function (item) {
        var categoryPuzzles = getPuzzlesByCategory(item.key);
        var doneCount = categoryPuzzles.filter(function (puzzle) {
          return !!completed[puzzle.id];
        }).length;

        var activeClass = item.key === app.selectedCategory ? " is-active" : "";

        return (
          '<button type="button" class="category-card' +
          activeClass +
          '" data-category="' +
          escapeHtml(item.key) +
          '">' +
          "<strong>" +
          escapeHtml(item.label) +
          "</strong>" +
          "<p>" +
          escapeHtml(item.description || "") +
          "</p>" +
          "<small>已完成 " +
          doneCount +
          " / " +
          categoryPuzzles.length +
          "</small>" +
          "</button>"
        );
      })
      .join("");

    el.categoryGrid.innerHTML = html;
  }

  function renderPuzzle() {
    if (!app.currentPuzzle) {
      return;
    }

    var puzzle = app.currentPuzzle;
    var scope = getPuzzlesByCategory(app.selectedCategory);
    var index = scope.findIndex(function (item) {
      return item.id === puzzle.id;
    });

    if (index === -1) {
      scope = puzzles;
      index = scope.findIndex(function (item) {
        return item.id === puzzle.id;
      });
    }

    el.puzzleStage.textContent = categoryLabel(puzzle.category) + " · 第 " + (index + 1) + " 题";
    el.puzzleTitle.textContent = puzzle.title;
    el.puzzleDescription.textContent = puzzle.description;
    el.puzzleProgressText.textContent = "进度：" + (index + 1) + " / " + scope.length;

    setPuzzleHint("按住任意代码卡片拖动排序，完成后点击提交。", "info");
    renderCodeList();
  }

  function renderCodeList(mismatchLookup, draggingIndex) {
    if (!app.currentPuzzle) {
      return;
    }

    var html = app.workingOrder
      .map(function (line, index) {
        var wrongClass = mismatchLookup && mismatchLookup[index] ? " is-wrong" : "";
        var draggingClass = draggingIndex === index ? " is-dragging" : "";

        return (
          '<article class="code-card' +
          wrongClass +
          draggingClass +
          '" data-index="' +
          index +
          '">' +
          '<div class="code-row">' +
          '<span class="line-no">第 ' +
          (index + 1) +
          " 行</span>" +
          '<pre class="code-line">' +
          escapeHtml(line) +
          "</pre>" +
          "</div>" +
          "</article>"
        );
      })
      .join("");

    el.codeList.innerHTML = html;
  }

  function onDragStart(event) {
    if (!app.currentPuzzle) {
      return;
    }

    if (event.pointerType === "mouse" && event.button !== 0) {
      return;
    }

    var blockTarget = event.target.closest("button, a, input, textarea, select");
    if (blockTarget && !blockTarget.classList.contains("code-card")) {
      return;
    }

    var card = event.target.closest(".code-card[data-index]");
    if (!card) {
      return;
    }

    var startIndex = Number(card.getAttribute("data-index"));
    if (!isValidIndex(startIndex, app.workingOrder.length)) {
      return;
    }

    event.preventDefault();

    app.drag.active = true;
    app.drag.pointerId = typeof event.pointerId === "number" ? event.pointerId : null;
    app.drag.startIndex = startIndex;
    app.drag.currentIndex = startIndex;
    app.drag.mismatchLookup = null;

    document.body.classList.add("is-sorting");
    card.classList.add("is-dragging");

    if (card.setPointerCapture && app.drag.pointerId !== null) {
      try {
        card.setPointerCapture(app.drag.pointerId);
      } catch (error) {
        // 部分浏览器对 capture 支持不一致，忽略即可
      }
    }

    document.addEventListener("pointermove", onDragMove);
    document.addEventListener("pointerup", onDragEnd);
    document.addEventListener("pointercancel", onDragEnd);

    setPuzzleHint("拖动到目标位置后松开即可。", "info");
  }

  function onDragMove(event) {
    if (!app.drag.active) {
      return;
    }

    if (app.drag.pointerId !== null && typeof event.pointerId === "number" && event.pointerId !== app.drag.pointerId) {
      return;
    }

    event.preventDefault();

    var target = document.elementFromPoint(event.clientX, event.clientY);
    if (!target) {
      return;
    }

    var card = target.closest(".code-card[data-index]");
    if (!card || !el.codeList.contains(card)) {
      return;
    }

    var toIndex = Number(card.getAttribute("data-index"));
    if (!isValidIndex(toIndex, app.workingOrder.length)) {
      return;
    }

    if (toIndex === app.drag.currentIndex) {
      return;
    }

    app.workingOrder = moveItemInOrder(app.workingOrder, app.drag.currentIndex, toIndex);
    app.drag.currentIndex = toIndex;
    renderCodeList(null, app.drag.currentIndex);
  }

  function onDragEnd(event) {
    if (!app.drag.active) {
      return;
    }

    if (event && app.drag.pointerId !== null && typeof event.pointerId === "number" && event.pointerId !== app.drag.pointerId) {
      return;
    }

    cancelDrag();

    if (el.viewPuzzle.classList.contains("is-active")) {
      renderCodeList();
      setPuzzleHint("顺序已更新，可继续拖拽或直接提交。", "info");
    }
  }

  function cancelDrag() {
    if (!app.drag.active) {
      return;
    }

    document.removeEventListener("pointermove", onDragMove);
    document.removeEventListener("pointerup", onDragEnd);
    document.removeEventListener("pointercancel", onDragEnd);

    document.body.classList.remove("is-sorting");

    app.drag.active = false;
    app.drag.pointerId = null;
    app.drag.startIndex = -1;
    app.drag.currentIndex = -1;
    app.drag.mismatchLookup = null;
  }

  function submitCurrentPuzzle() {
    if (!app.currentPuzzle) {
      return;
    }

    cancelDrag();

    var result = engine.checkOrder(app.workingOrder, app.currentPuzzle.correctOrder);

    app.state.totalAttempts += 1;
    app.state.lastSessionAt = new Date().toISOString();

    if (result.isCorrect) {
      app.state.totalCorrect += 1;
      app.state.streak += 1;
      if (app.state.streak > app.state.bestStreak) {
        app.state.bestStreak = app.state.streak;
      }

      pushUnique(app.state.completedPuzzles, app.currentPuzzle.id);
      removeValue(app.state.wrongPuzzleIds, app.currentPuzzle.id);

      app.pendingNextId = findNextPuzzleId(app.currentPuzzle.id, app.selectedCategory);
      if (app.pendingNextId) {
        app.state.currentPuzzleId = app.pendingNextId;
      }
    } else {
      app.state.streak = 0;
      pushUnique(app.state.wrongPuzzleIds, app.currentPuzzle.id);
      app.pendingNextId = null;
      app.state.currentPuzzleId = app.currentPuzzle.id;
    }

    persistState();
    renderHome();
    renderResult(result);
  }

  function findNextPuzzleId(currentId, categoryKey) {
    var list = getPuzzlesByCategory(categoryKey);
    if (!list.length) {
      return null;
    }

    var index = list.findIndex(function (item) {
      return item.id === currentId;
    });

    if (index !== -1 && index < list.length - 1) {
      return list[index + 1].id;
    }

    var completed = toLookup(app.state.completedPuzzles);
    for (var i = 0; i < list.length; i += 1) {
      if (!completed[list[i].id]) {
        return list[i].id;
      }
    }

    return null;
  }

  function renderResult(result) {
    var isSuccess = result.isCorrect;

    el.resultPanel.classList.toggle("is-success", isSuccess);
    el.resultPanel.classList.toggle("is-fail", !isSuccess);

    el.resultExplanation.textContent = app.currentPuzzle.explanation;

    if (isSuccess) {
      el.resultStatusTag.textContent = "拼图成功";
      el.resultTitle.textContent = "拼图成功！";
      el.resultSubtitle.textContent = "顺序完全正确，你已经掌握了这道题的执行流程。";
      el.resultExtra.textContent = "当前连胜：" + app.state.streak + " 题，最高连胜：" + app.state.bestStreak + " 题";

      renderResultCodeList(app.currentPuzzle.correctOrder, null);

      el.nextBtn.hidden = false;
      el.nextBtn.disabled = !app.pendingNextId;
      el.nextBtn.textContent = app.pendingNextId ? "下一题" : "本分类已完成";
      el.retryBtn.hidden = true;
      el.resultResetBtn.hidden = true;
    } else {
      var wrongLines = result.mismatchIndexes.map(function (index) {
        return index + 1;
      });

      el.resultStatusTag.textContent = "继续加油";
      el.resultTitle.textContent = "顺序不正确";
      el.resultSubtitle.textContent = "第 " + wrongLines.join("、") + " 行位置有问题，调整后再试一次。";
      el.resultExtra.textContent = "连胜已重置，别担心，下一题继续追回来。";

      renderResultCodeList(app.workingOrder, toLookup(result.mismatchIndexes));

      el.nextBtn.hidden = true;
      el.retryBtn.hidden = false;
      el.resultResetBtn.hidden = false;
    }

    showView("result");
  }

  function renderResultCodeList(lines, mismatchLookup) {
    var html = lines
      .map(function (line, index) {
        var wrongClass = mismatchLookup && mismatchLookup[index] ? " is-wrong" : "";
        return '<div class="result-line' + wrongClass + '">' + escapeHtml(line) + "</div>";
      })
      .join("");

    el.resultCodeList.innerHTML = html;
  }

  function goToNextPuzzle() {
    if (!app.pendingNextId) {
      setBanner("当前分类已完成，可切换分类继续练习。", "info");
      showView("home");
      return;
    }

    openPuzzle(app.pendingNextId, true);
  }

  function resetCurrentOrder() {
    cancelDrag();
    app.workingOrder = app.initialOrder.slice();
    renderCodeList();
  }

  function setPuzzleHint(text, type) {
    el.puzzleHint.textContent = text;
    el.puzzleHint.classList.remove("warn");
    if (type === "warn") {
      el.puzzleHint.classList.add("warn");
    }
  }

  function renderStats() {
    var completedCount = app.state.completedPuzzles.length;
    var attempts = app.state.totalAttempts;
    var correct = app.state.totalCorrect;
    var accuracy = attempts ? Math.round((correct / attempts) * 100) : 0;

    var cards = [
      { label: "已完成题数", value: completedCount + " / " + puzzles.length },
      { label: "总提交次数", value: String(attempts) },
      { label: "累计答对", value: String(correct) },
      { label: "正确率", value: accuracy + "%" },
      { label: "当前连胜", value: app.state.streak + " 题" },
      { label: "最高连胜", value: app.state.bestStreak + " 题" }
    ];

    el.statsGrid.innerHTML = cards
      .map(function (item) {
        return '<article class="stat-card"><b>' + escapeHtml(item.value) + "</b><span>" + escapeHtml(item.label) + "</span></article>";
      })
      .join("");

    renderCategoryProgress();
    renderWrongList();
  }

  function renderCategoryProgress() {
    var completed = toLookup(app.state.completedPuzzles);

    var html = categories
      .filter(function (item) {
        return item.key !== "all";
      })
      .map(function (item) {
        var list = getPuzzlesByCategory(item.key);
        var done = list.filter(function (puzzle) {
          return !!completed[puzzle.id];
        }).length;

        var percent = list.length ? Math.round((done / list.length) * 100) : 0;

        return (
          '<article class="category-progress-item">' +
          '<div class="row"><span>' +
          escapeHtml(item.label) +
          "</span><b>" +
          done +
          " / " +
          list.length +
          "</b></div>" +
          '<div class="progress-bar"><span style="width:' +
          percent +
          '%"></span></div>' +
          "</article>"
        );
      })
      .join("");

    el.categoryProgressList.innerHTML = html;
  }

  function renderWrongList() {
    var wrongIds = (app.state.wrongPuzzleIds || []).slice().sort(function (a, b) {
      return a - b;
    });

    if (!wrongIds.length) {
      el.wrongList.innerHTML = '<p class="empty">暂无错题，继续保持。</p>';
      el.clearWrongBtn.disabled = true;
      return;
    }

    el.clearWrongBtn.disabled = false;

    var html = wrongIds
      .map(function (id) {
        var puzzle = getPuzzleById(id);
        if (!puzzle) {
          return "";
        }

        return (
          '<button type="button" class="wrong-item" data-puzzle-id="' +
          id +
          '">' +
          "<strong>#" +
          id +
          " " +
          escapeHtml(puzzle.title) +
          "</strong>" +
          "<span>" +
          escapeHtml(categoryLabel(puzzle.category)) +
          " · 点击重新练习</span>" +
          "</button>"
        );
      })
      .join("");

    el.wrongList.innerHTML = html;
  }

  function onWrongItemClick(event) {
    var button = event.target.closest("button[data-puzzle-id]");
    if (!button) {
      return;
    }

    var puzzleId = Number(button.getAttribute("data-puzzle-id"));
    var puzzle = getPuzzleById(puzzleId);
    if (!puzzle) {
      return;
    }

    applyCategory(puzzle.category, false);
    openPuzzle(puzzle.id, true);
  }

  function setBanner(text, type) {
    el.homeBanner.textContent = text;
    el.homeBanner.className = "banner " + (type || "info");
    el.homeBanner.hidden = false;
  }

  function moveItemInOrder(order, fromIndex, toIndex) {
    if (engine && typeof engine.moveItem === "function") {
      return engine.moveItem(order, fromIndex, toIndex);
    }

    var next = order.slice();
    if (!isValidIndex(fromIndex, next.length) || !isValidIndex(toIndex, next.length) || fromIndex === toIndex) {
      return next;
    }

    var moved = next.splice(fromIndex, 1)[0];
    next.splice(toIndex, 0, moved);
    return next;
  }

  function isValidIndex(index, length) {
    return Number.isInteger(index) && index >= 0 && index < length;
  }

  function toLookup(list) {
    var output = {};
    if (!Array.isArray(list)) {
      return output;
    }
    for (var i = 0; i < list.length; i += 1) {
      output[list[i]] = true;
    }
    return output;
  }

  function pushUnique(list, value) {
    if (!Array.isArray(list)) {
      return;
    }
    if (list.indexOf(value) === -1) {
      list.push(value);
    }
  }

  function removeValue(list, value) {
    if (!Array.isArray(list)) {
      return;
    }
    var index = list.indexOf(value);
    if (index !== -1) {
      list.splice(index, 1);
    }
  }

  function escapeHtml(text) {
    return String(text)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/\"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }
})(window);

  </script>
</body>
</html>
